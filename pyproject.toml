[project]
name = "nfl-edge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "nflreadpy==0.1.5",
    "polars>=1.0",
    "requests==2.33.0",
    "fastapi>=0.116,<1",
    "uvicorn>=0.35,<1",
    "argon2-cffi>=23.1,<26",
]

[project.optional-dependencies]
model-development = [
    "xgboost==2.1.4",
    "scikit-learn>=1.5,<2",
    "pandas==3.0.5",
    "pyarrow==25.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]