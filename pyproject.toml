[project]
name = "nfl-edge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "nflreadpy==0.1.5",
    "polars>=1.0",
    "requests==2.33.0",
]

[project.optional-dependencies]
model-development = [
    "xgboost==2.1.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
