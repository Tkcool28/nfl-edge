# QB-Elo v1 Configuration
#
# This file defines the frozen configuration for the QB-adjusted Elo baseline.
# The parameters are chosen to be conservative and well-documented. Changes
# to this file require a new model version and are recorded in the tuning ledger.
#
# The parameter policy (Task 03A §9) permits:
# - One frozen primary configuration
# - A very small sensitivity audit (~3 variants max)
# - No broad hyperparameter mining

initial_rating: 1500.0

home_field_elo: 48.0
# Standard 48 Elo points ~ 3.6 points preferred on a Pythagorean scale.
# This is a well-known constant from FiveThirtyEight and Tango, with
# an empirical ballpark of 40-55 points depending on sport and era.

k_factor_regular: 20.0
# Moderate K factor allows ratings to converge quickly enough for recent
# changes without overreacting to single-game noise.

k_factor_postseason: 4.0
# Postseason series are best-of-one; K is reduced to prevent blowouts
# from over-adjusting. The multiplier (1 + mov_cap * (margin/6)^2) is
# capped at 2.5, so the K effectively sets the maximum Elo swing.

season_mean_reversion_fraction: 0.333
# Teams regress 1/3 toward 1500 at season boundary. This smooths for
# roster turnover and prevents runaway ratings. Tuned empirically to
# balance stability with responsiveness.

margin_of_victory:
  divisor: 6.0
  cap: 2.5
# FiveThirtyEight-style multiplier: 1 + (margin/6)^2, capped at 2.5.
# This protects against blowout games while rewarding large winners.

probability:
  min: 0.01
  max: 0.99
# Clamp bounds for numerical safety only. Tightening or widening
# these bounds is not used to improve calibration (Task 03A §13).

qb_adjustment:
  scale_elo_per_shrunk_epa: 500.0
  max_abs_elo: 50.0
  replacement_passing_epa: -0.05
  sample_k: 250.0
  unknown_returns_zero: true
  supported_uses_replacement_scenario: true

# Derived value: The weight formula is documented in docs/feature_pipeline_v1.md:
#   weight = prior_dropbacks / (prior_dropbacks + 250)
#   shrunk = weight * observed + (1 - weight) * fixed_prior