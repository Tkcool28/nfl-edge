# Backtest Configuration — NFL Edge

blocked_seasons:
  - 2025  # Sealed holdout, never accessible to backtest code
  - 2026  # Forward-use season, never accessible to backtest code

## Walk-Forward Engine

method: expanding_weekly_walk_forward
order:
  - season
  - season_type_priority   # REG(0) < WC(1) < DIV(2) < CON(3) < SB(4)
  - week

## Block Guarantees

block_guarantees:
  - one_frozen_prediction_per_game
  - predict_full_block_before_state_update
  - no_same_week_partial_reveal
  - no_shuffled_split
  - no_random_split
  - no_cross_validation
  - duplicate_block: reject
  - duplicate_prediction_id: reject
  - missing_block: reject
  - overwrite: refuse_by_default

## Warm-Up Policy

warm_up:
  policy: "all development predictions scored"
  rationale: >
    Elo has no fitted parameters; state always exists and always advances.
    No minimum-prior-history threshold is needed.
  unscored_warmup_rows: 0

## Tripwires

tripwires:
  - name: sealed_holdout_access_error
    raised_when: "any season > 2024 reaches backtest, model, or evaluation code"
  - name: market_column_error
    raised_when: "away_moneyline, home_moneyline, spread_line, total_line, or any sportsbook field enters model inputs"
