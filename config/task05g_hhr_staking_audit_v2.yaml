version: task05g_hhr_staking_audit_v2
status: PREREGISTERED_BEFORE_2020_2024_REPLAY
scope: HHR_STAKING_ONLY
supersedes_audit_input_only: task05g_hhr_staking_audit_v1
selector_dependency: task05g_final_selectors_v1
selector_changes_allowed: false
development_seasons: [2020, 2021, 2022, 2023, 2024]
sealed_not_run: [2025]

correction_from_v1:
  reason: staking_confidence_must_match_frozen_HHR_selector_confidence_quantity
  old_confidence_input: model_confidence_probability
  corrected_confidence_input: selector_trust
  thresholds_changed: false
  warning_threshold_changed: false
  minimum_units_changed: false

principles:
  - HHR selection is frozen and untouched.
  - selector_trust is the already-frozen confidence quantity used to rank HHR candidates.
  - Every selected supported HHR headline receives positive units.
  - HHR staking does not require VALUE or positive EV.
  - Exact retail price can haircut stake only after HHR selection; it cannot alter the selection.
  - HHR never becomes NO/LEAN/PASS/zero solely due to juice or EV.

confidence_base_units:
  selector_trust_gte_0_70: 1.25
  selector_trust_gte_0_65: 1.00
  selector_trust_gte_0_60: 0.75
  selector_trust_below_0_60: 0.50

price_pressure:
  definition: break_even_probability_minus_selector_trust
  haircut:
    pressure_lte_0_00: 0.00
    pressure_gt_0_00_lte_0_04: 0.25
    pressure_gt_0_04_lte_0_08: 0.50
    pressure_gt_0_08_lte_0_10: 0.75
    pressure_gt_0_10: force_floor

minimum_hhr_units: 0.25
heavily_juiced_warning_pressure_gte: 0.08
warning_label: HEAVILY_JUICED

prohibited:
  - change_hhr_selector
  - use_EV_or_price_to_choose_HHR
  - substitute_HHR_candidate_due_to_price
  - zero_unit_selected_HHR
  - open_or_run_2025
  - tune_thresholds_from_replay_profit
