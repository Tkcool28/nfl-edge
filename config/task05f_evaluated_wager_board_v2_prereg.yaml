version: task05f_evaluated_wager_board_v2
status: PREREGISTERED_BEFORE_V2_HISTORICAL_OUTCOME_SCORING
scope: evaluator_owned_market_agnostic_wager_board

upstream:
  candidate_table: config/task05f_candidate_table_v1.yaml
  locked_evaluator: config/task05f_evaluator_locked_v1.yaml
  play_through: config/task05f_play_through_v1_1_prereg.yaml
  staking_units: config/task05f_staking_v2_1_reliability_prereg.yaml

responsibility:
  evaluator_owns_wager_judgment: true
  selector_may_not_recompute_model_or_market_math: true
  user_risk_style_may_not_change_wager_identity_or_units: true

football_confidence_adapter:
  purpose: create one comparable frozen-football confidence axis before selection
  moneyline:
    input: raw_football_output
    semantics: selected_side_probability
    z_score: normal_inverse_cdf(raw_football_output)
  spread:
    input: raw_football_output_and_actionable_line
    selected_side_edge_home: raw_football_output + actionable_line
    selected_side_edge_away: -raw_football_output + actionable_line
    frozen_error_scale: 13.814494036869487
    scale_source: reports/development/expected_margin_development_scorecard.json.margin_rmse
    z_score: selected_side_edge_points / frozen_error_scale
  total:
    input: raw_football_output_and_actionable_line
    selected_side_edge_over: raw_football_output - actionable_line
    selected_side_edge_under: actionable_line - raw_football_output
    frozen_error_scale: 13.5453379336442
    scale_source: reports/task05d/task05d_ridge_candidate_metrics.json.R4.oob_rmse
    z_score: selected_side_edge_points / frozen_error_scale
  cash_confidence_proxy: normal_cdf(z_score)
  note: cash_confidence_proxy_is_not_evaluator_fair_probability

board_fields_added:
  - football_confidence_z
  - football_cash_confidence_proxy
  - football_selected_side_edge_points
  - evaluator_units
  - evaluator_unit_reason
  - primary_actionable
  - strict_value_actionable

primary_actionable:
  supported_required: true
  reliability_allowed: [HIGH, MEDIUM, LOW]
  price_status: [VALUE, PLAYABLE]
  positive_evaluator_units_required: true
  unsupported: false
  lean_pass: false

strict_value_actionable:
  primary_actionable_required: true
  price_status: VALUE
  strict_positive_value_required: true
  expected_value_gt_zero: true

integrity:
  no_market_type_preference: true
  no_model_fit: true
  no_probability_fit: true
  no_roi_input: true
  no_hit_rate_threshold_input: true
  no_outcome_fields: true
  no_2025: true
