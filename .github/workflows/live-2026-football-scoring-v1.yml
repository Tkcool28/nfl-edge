name: Live 2026 Football Scoring V1

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-football-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      OPENBLAS_CORETYPE: "HASWELL"
      MKL_NUM_THREADS: "1"
      MKL_CBWR: "COMPATIBLE"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[model-development]' pyyaml pytest

      - name: Prove frozen methodology surfaces are untouched
        run: |
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD)"
          echo "$changed"
          if echo "$changed" | grep -E '^(src/nfl_edge/models/|src/nfl_edge/backtest/|src/nfl_edge/holdout/|config/expected_margin_v1.yaml$|config/qb_elo_v1.yaml$|config/totals_)'; then
            echo 'ERROR: frozen model/methodology surface changed' >&2
            exit 1
          fi

      - name: Compile live scorer surfaces
        run: |
          python -m py_compile \
            src/nfl_edge/live/week1_2026.py \
            src/nfl_edge/live/roof.py \
            src/nfl_edge/live/roof_scenarios.py \
            src/nfl_edge/live/sleeper_qb.py \
            src/nfl_edge/live/features_2026.py \
            src/nfl_edge/live/model_adapters.py \
            src/nfl_edge/live/qb_inputs.py \
            src/nfl_edge/live/state_2026.py \
            src/nfl_edge/live/state_advancement_2026.py \
            src/nfl_edge/live/totals_features.py \
            src/nfl_edge/features/totals_v1/pbp_semantics.py \
            src/nfl_edge/features/totals_v1/game_observations.py \
            src/nfl_edge/live/scorer_2026.py \
            src/nfl_edge/live/schedule_materializer_2026.py \
            scripts/run_2026_live_football_scoring_v1.py \
            scripts/verify_live_2026_preprovider_v1.py

      - name: Focused live football tests
        run: |
          pytest -q \
            tests/live/test_week1_2026.py \
            tests/live/test_roof_resolution.py \
            tests/live/test_roof_scenario_adapter.py \
            tests/live/test_sleeper_qb_live_resolver.py \
            tests/live/test_live_2026_scoring.py \
            tests/live/test_schedule_materializer_2026.py \
            tests/live/test_settled_totals_semantics_2026.py \
            tests/live/test_product_state_2026.py


  real-week2-state-advancement-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: deterministic-football-gate
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      OPENBLAS_CORETYPE: "HASWELL"
      MKL_NUM_THREADS: "1"
      MKL_CBWR: "COMPATIBLE"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[model-development]' pyyaml pytest

      - name: Materialize real Week 2 boundary inputs with zero market access
        run: |
          rm -rf /tmp/nfl-edge-live-week2
          python scripts/materialize_live_weekly_inputs_v1.py \
            --output-dir /tmp/nfl-edge-live-week2 \
            --active-as-of-utc 2026-09-15T12:00:00Z \
            > /tmp/week2-materialization.json
          cat /tmp/week2-materialization.json

      - name: Advance real entering-2026 state through settled Week 1
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from nfl_edge.live.evidence_2026 import load_settled_evidence
          from nfl_edge.live.state_2026 import bootstrap_entering_2026_state
          from nfl_edge.live.state_advancement_2026 import advance_entering_state_through_settled_weeks

          root = Path.cwd()
          evidence_root = Path("/tmp/nfl-edge-live-week2")
          evidence = load_settled_evidence(evidence_root)
          assert evidence.through_week == 1
          assert evidence.games.height == 16
          assert evidence.team_stats.height == 32
          assert evidence.qb_stats.height >= 32
          assert evidence.pbp.height > 0

          entering = bootstrap_entering_2026_state(root)
          advanced = advance_entering_state_through_settled_weeks(
              repository_root=root,
              active_schedule_path=evidence_root / "week2_schedule_v1.json",
              evidence=evidence,
              entering_state=entering,
          )
          assert len(advanced.completed_2026_blocks) == 1
          assert advanced.state_version != entering.state_version
          assert advanced.totals_training.height > entering.totals_training.height
          assert advanced.xgb_history.height > entering.xgb_history.height
          assert advanced.expected_history.height > entering.expected_history.height

          proof = {
              "verdict": "REAL_WEEK2_STATE_ADVANCEMENT_READY",
              "active_week": 2,
              "settled_through_week": evidence.through_week,
              "completed_2026_blocks": list(advanced.completed_2026_blocks),
              "entering_state_version": entering.state_version,
              "advanced_state_version": advanced.state_version,
              "settled_games": evidence.games.height,
              "team_stats": evidence.team_stats.height,
              "qb_stats": evidence.qb_stats.height,
              "pbp_rows": evidence.pbp.height,
              "provider_request_count": 0,
              "odds_api_called": False,
          }
          print(json.dumps(proof, sort_keys=True))
          PY



  real-week2-preprovider-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: real-week2-state-advancement-proof
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      OPENBLAS_CORETYPE: "HASWELL"
      MKL_NUM_THREADS: "1"
      MKL_CBWR: "COMPATIBLE"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[model-development]' pyyaml pytest

      - name: Materialize real Week 2 boundary inputs
        run: |
          rm -rf /tmp/nfl-edge-live-week2 /tmp/nfl-edge-selector-runs
          python scripts/materialize_live_weekly_inputs_v1.py \
            --output-dir /tmp/nfl-edge-live-week2 \
            --active-as-of-utc 2026-09-15T12:00:00Z \
            > /tmp/week2-materialization.json

      - name: Seed deterministic Week 2-compatible Sleeper fixture
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import polars as pl

          from nfl_edge.live.week1_2026 import EXPECTED_TEAMS

          root = Path("data/source_audits/sleeper_qb_v1")
          normalized = root / "normalized"
          normalized.mkdir(parents=True, exist_ok=True)
          snapshot_id = "ci-week2-preprovider-qb-v1"
          observed = "2026-09-15T11:55:00Z"

          snapshots = []
          crosswalk = []
          evidence = []
          for index, team in enumerate(sorted(EXPECTED_TEAMS), start=1):
              sleeper_id = f"ci-s-{index:02d}"
              gsis_id = f"00-CI-W2-{index:02d}"
              snapshots.append({
                  "snapshot_id": snapshot_id,
                  "fetched_at_utc": observed,
                  "sleeper_player_id": sleeper_id,
                  "gsis_id": gsis_id,
                  "full_name": f"CI {team} Quarterback",
                  "team": team,
                  "active": True,
                  "years_exp": 3,
                  "injury_status": None,
                  "depth_chart_position": "QB",
                  "depth_chart_order": 1,
              })
              crosswalk.append({
                  "snapshot_id": snapshot_id,
                  "sleeper_player_id": sleeper_id,
                  "gsis_id": gsis_id,
                  "nflverse_player_id": gsis_id,
                  "match_method": "exact_sleeper_id",
                  "is_matched": True,
                  "review_required": False,
                  "conflict_reason": None,
              })
              evidence.append({
                  "snapshot_id": snapshot_id,
                  "sleeper_player_id": sleeper_id,
                  "evidence_state": "DEPTH_CHART_EXPECTED_HEALTHY",
              })

          pl.DataFrame(snapshots).write_parquet(normalized / "qb_snapshots.parquet")
          pl.DataFrame(crosswalk).write_parquet(normalized / "qb_identity_crosswalk.parquet")
          pl.DataFrame(evidence).write_parquet(normalized / "qb_evidence_states.parquet")
          (root / "latest_snapshot.json").write_text(
              json.dumps({"snapshot_id": snapshot_id}, sort_keys=True) + "\n"
          )
          (root / "latest_run_status.json").write_text(
              json.dumps({"run_outcome": "SUCCESS"}, sort_keys=True) + "\n"
          )
          PY

      - name: Seed governed pregame selector fixture for the full preflight
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          schedule = json.loads(Path("/tmp/nfl-edge-live-week2/week1_schedule_v1.json").read_text())
          game = sorted(schedule["games"], key=lambda row: row["game_id"])[0]
          kickoff = datetime.fromisoformat(game["scheduled_start_utc"].replace("Z", "+00:00"))
          captured = (kickoff - timedelta(hours=1)).astimezone(timezone.utc)
          captured_text = captured.isoformat(timespec="seconds").replace("+00:00", "Z")
          run = Path("/tmp/nfl-edge-selector-runs/week1-pregame-proof")
          (run / "product").mkdir(parents=True, exist_ok=True)
          (run / "run-status.json").write_text(json.dumps({"outcome": "SUCCESS"}))

          def row(market):
              return {
                  "candidate_id": f"{game['game_id']}|{market}|home",
                  "game_id": game["game_id"],
                  "season": 2026,
                  "week": 1,
                  "market_type": market,
                  "selected_side": "home",
                  "sportsbook": "draftkings",
                  "line": None if market == "moneyline" else -2.5,
                  "american_odds": -110,
                  "supported": True,
                  "reliability": "HIGH",
                  "model_confidence_supported": True,
                  "model_confidence_support_n": 512,
                  "model_confidence_probability": 0.62,
                  "pinnacle_anchor_probability": 0.58,
                  "break_even_probability": 0.52,
                  "expected_value": 0.08,
                  "evaluated_edge_probability": 0.10,
                  "price_status": "VALUE",
                  "model_candidate_regions": (
                      "ML_DOG_VALUE_ZONE_AVG"
                      if market == "moneyline"
                      else "SPREAD_DISAGREEMENT_EXPECTED_MARGIN_0_4"
                  ),
                  "model_price_gap": 0.05,
                  "model_cover_margin_v3": 2.0,
              }

          proof = {
              "selector_evidence": {
                  "schema_version": "NFL_EDGE_LIVE_SELECTOR_EVIDENCE_V1",
                  "season": 2026,
                  "week": 1,
                  "captured_at_utc": captured_text,
                  "games": [{
                      "game_id": game["game_id"],
                      "kickoff_at_utc": game["scheduled_start_utc"],
                  }],
                  "rows": [row("moneyline"), row("spread")],
              }
          }
          (run / "product" / "deterministic-proof.json").write_text(
              json.dumps(proof, sort_keys=True)
          )
          PY

      - name: Run canonical zero-provider Week 2 preflight
        run: |
          python scripts/verify_live_2026_preprovider_v1.py \
            --repository-root . \
            --schedule-root /tmp/nfl-edge-live-week2 \
            --evidence-root /tmp/nfl-edge-live-week2 \
            --run-root /tmp/nfl-edge-selector-runs \
            --prediction-as-of-utc "2026-09-15T12:00:00Z" \
            | tee /tmp/week2-preprovider-proof.json
          python - <<'PY'
          import json
          from pathlib import Path

          proof = json.loads(Path("/tmp/week2-preprovider-proof.json").read_text())
          assert proof["verdict"] == "NFL_EDGE_PREPROVIDER_READY"
          assert proof["season"] == 2026
          assert proof["week"] == 2
          assert proof["settled_through_week"] == 1
          assert proof["completed_2026_blocks"] == ["2026_REG_W01"]
          assert proof["football_game_count"] == 16
          assert proof["provider_request_count"] == 0
          assert proof["odds_api_called"] is False
          assert proof["market_data_read"] is False
          assert proof["selector_state_observations"]["moneyline"] == 1
          assert proof["selector_state_observations"]["spread"] == 1
          PY


  real-sleeper-week1-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: deterministic-football-gate
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      OPENBLAS_CORETYPE: "HASWELL"
      MKL_NUM_THREADS: "1"
      MKL_CBWR: "COMPATIBLE"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[model-development]' pyyaml pytest

      - name: Collect one fresh Sleeper QB audit snapshot
        run: |
          mkdir -p artifacts/live_2026_football
          python scripts/collect_sleeper_qbs.py --kind scheduled \
            > artifacts/live_2026_football/sleeper_collection.json

      - name: Score the real Week 1 schedule twice from the same Sleeper snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import polars as pl
          from nfl_edge.live.scorer_2026 import canonical_snapshot_bytes, score_week1
          from nfl_edge.live.sleeper_qb import SleeperExpectedQBResolver, SleeperQBSource, load_overrides
          from nfl_edge.live.state_2026 import bootstrap_entering_2026_state

          root = Path.cwd()
          pointer = json.loads((root/'data/source_audits/sleeper_qb_v1/latest_snapshot.json').read_text())
          snapshot_id = pointer['snapshot_id']
          rows = pl.read_parquet(root/'data/source_audits/sleeper_qb_v1/normalized/qb_snapshots.parquet').filter(
              pl.col('snapshot_id').cast(pl.Utf8) == snapshot_id
          )
          observed = sorted(str(x) for x in rows['fetched_at_utc'].drop_nulls().unique().to_list())
          assert len(observed) == 1
          as_of = observed[0]
          source = SleeperQBSource.load(root, prediction_as_of_utc=as_of)
          resolver = SleeperExpectedQBResolver(
              source,
              overrides=load_overrides(root/'config/live_qb_overrides_v1.json'),
          )
          state = bootstrap_entering_2026_state(root)
          first = score_week1(
              repository_root=root,
              prediction_as_of_utc=as_of,
              resolver=resolver,
              entering_state=state,
          )
          second = score_week1(
              repository_root=root,
              prediction_as_of_utc=as_of,
              resolver=resolver,
              entering_state=state,
          )
          a = canonical_snapshot_bytes(first)
          b = canonical_snapshot_bytes(second)
          assert a == b
          out = root/'artifacts/live_2026_football'
          (out/'week1_football_snapshot.json').write_bytes(a)
          (out/'week1_football_snapshot_repeat.json').write_bytes(b)
          proof = {
              'verdict': '2026_LIVE_FOOTBALL_SCORING_READY',
              'prediction_as_of_utc': as_of,
              'sleeper_snapshot_id': snapshot_id,
              'snapshot_sha256': first['snapshot_sha256'],
              'week1_game_count': len(first['games']),
              'qb_resolution_counts': first['qb_resolution_counts'],
              'model_scoring_counts': first['model_scoring_counts'],
              'deterministic_repeat_bytes': True,
              'odds_api_called': False,
              'market_data_read': False,
          }
          (out/'proof.json').write_text(json.dumps(proof, indent=2, sort_keys=True)+'\n')
          print(json.dumps(proof, sort_keys=True))
          PY
          cmp artifacts/live_2026_football/week1_football_snapshot.json \
              artifacts/live_2026_football/week1_football_snapshot_repeat.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-2026-football-scoring-${{ github.sha }}
          path: artifacts/live_2026_football/
          if-no-files-found: warn
