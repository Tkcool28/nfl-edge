name: Temporary Task05F Board Identity Fix Push

on:
  push:
    branches: [fix/task05f-board-identity-v1]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/task05f-board-identity-v1
          fetch-depth: 0
      - name: Apply reconciliation and remove temporary builders
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json, subprocess
          from pathlib import Path

          OLD='e28f0eb43275fc97c8e36744e032ef401d7659b72854dc5a3aa25236ce1e5dad'
          NEW='58302290e4dc98d6db13e8e8a46c148e8c58533b2c9930370262982be06ce2a8'
          BASE='2a8f0a048377932aa5c0c2703e08d254b6c75540'
          v3p=Path('reports/pre2025/pre2025_successor_executor_final_freeze_v3.json')
          v4p=Path('reports/pre2025/pre2025_successor_executor_final_freeze_v4.json')

          runtime_path=Path('src/nfl_edge/holdout/executor_runtime_2025.py')
          text=runtime_path.read_text()
          old=f'HISTORICAL_BOARD_SHA256 = "{OLD}"'
          new=f'HISTORICAL_BOARD_SHA256 = "{NEW}"'
          if text.count(old)!=1: raise SystemExit('unexpected runtime board constant')
          runtime_path.write_text(text.replace(old,new))

          audit_path=Path('scripts/task05g_successor_executor_contract_audit_v1.py')
          text=audit_path.read_text()
          text=text.replace('FINAL_PROMOTION_RECORD = "reports/pre2025/pre2025_successor_executor_final_freeze_v3.json"','FINAL_PROMOTION_RECORD = "reports/pre2025/pre2025_successor_executor_final_freeze_v4.json"')
          text=text.replace('promotion.get("schema_version") != "pre2025_successor_executor_final_freeze_v3"','promotion.get("schema_version") != "pre2025_successor_executor_final_freeze_v4"')
          needle='    promotion_authorization = dict(promotion.get("authorization") or {})\n'
          check='''    board_identity = dict(promotion.get("task05f_historical_board_identity") or {})
    if board_identity != {
        "accepted_sha256": "58302290e4dc98d6db13e8e8a46c148e8c58533b2c9930370262982be06ce2a8",
        "stale_executor_sha256": "e28f0eb43275fc97c8e36744e032ef401d7659b72854dc5a3aa25236ce1e5dad",
        "final_task05f_head": "9e1b0aa6bd902e3e5f09d8578d152d9519e2144b",
        "final_validation_run_id": 32593593889,
        "final_validation_artifact_id": 9480985688,
        "revalidation_run_id": 33446927583,
        "revalidation_artifact_id": 9778405026,
        "failed_preopen_carrier_run_id": 33448022082,
        "failed_before_2025_market_download": True,
        "holdout_spent_marker_created": False,
        "holdout_data_bytes_read": 0,
        "correction_type": "IDENTITY_RECONCILIATION_ONLY",
    }:
        raise AuditFailure("Task05F historical-board identity reconciliation drift")
'''
          if needle not in text: raise SystemExit('audit insertion point missing')
          audit_path.write_text(text.replace(needle,check+needle))

          test_path=Path('tests/holdout/test_executor_runtime_2025_gate.py')
          text=test_path.read_text()
          if 'test_runtime_task05f_board_identity_matches_final_accepted_freeze' in text: raise SystemExit('test already present')
          text += '''\n\ndef test_runtime_task05f_board_identity_matches_final_accepted_freeze():
    repo_root = Path(__file__).resolve().parents[2]
    promotion = json.loads((repo_root / "reports/pre2025/pre2025_successor_executor_final_freeze_v4.json").read_text(encoding="utf-8"))
    import nfl_edge.holdout.executor_runtime_2025 as runtime
    identity = promotion["task05f_historical_board_identity"]
    expected = "58302290e4dc98d6db13e8e8a46c148e8c58533b2c9930370262982be06ce2a8"
    assert identity["accepted_sha256"] == expected
    assert identity["correction_type"] == "IDENTITY_RECONCILIATION_ONLY"
    assert identity["holdout_spent_marker_created"] is False
    assert identity["holdout_data_bytes_read"] == 0
    assert runtime.HISTORICAL_BOARD_SHA256 == expected
'''
          test_path.write_text(text)

          def blob(p): return subprocess.check_output(['git','hash-object',str(p)],text=True).strip()
          v3=json.loads(v3p.read_text())
          v4=dict(v3)
          v4['schema_version']='pre2025_successor_executor_final_freeze_v4'
          v4['frozen_from_head']=BASE
          v4['supersedes_final_freeze']={'path':str(v3p),'git_blob':subprocess.check_output(['git','rev-parse',f'{BASE}:{v3p}'],text=True).strip(),'reason':'task05f_final_board_identity_reconciliation'}
          v4['task05f_historical_board_identity']={
            'accepted_sha256':NEW,'stale_executor_sha256':OLD,
            'final_task05f_head':'9e1b0aa6bd902e3e5f09d8578d152d9519e2144b',
            'final_validation_run_id':32593593889,'final_validation_artifact_id':9480985688,
            'revalidation_run_id':33446927583,'revalidation_artifact_id':9778405026,
            'failed_preopen_carrier_run_id':33448022082,'failed_before_2025_market_download':True,
            'holdout_spent_marker_created':False,'holdout_data_bytes_read':0,
            'correction_type':'IDENTITY_RECONCILIATION_ONLY'}
          v4['holdout_opened']=False; v4['holdout_data_bytes_read']=0; v4['holdout_predictions_executed']=0
          v4['methodology_changed']=False; v4['tuning_performed']=False
          blobs=dict(v4['frozen_source_blobs'])
          for p in (runtime_path,audit_path,test_path): blobs[str(p)]=blob(p)
          v4['frozen_source_blobs']=blobs
          v4p.write_text(json.dumps(v4,indent=2)+'\n')

          for helper in (Path('.github/workflows/tmp-task05f-board-identity-fix.yml'),Path('.github/workflows/tmp-task05f-board-identity-fix-push.yml')):
              if helper.exists(): helper.unlink()
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: reconcile frozen Task05F board identity'
          git push origin HEAD:fix/task05f-board-identity-v1
