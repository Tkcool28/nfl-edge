name: Task05G Value Non-GREEN Singleton Fail-Safe V1

on:
  pull_request:
    branches:
      - feat/task05g-value-spread-pareto-frontier-v1
    paths:
      - 'docs/task05g_value_nongreen_singleton_failsafe_v1_preregistration.md'
      - 'scripts/task05g_value_nongreen_singleton_failsafe_v1.py'
      - '.github/workflows/task05g-value-nongreen-singleton-failsafe-v1.yml'
      - 'reports/task05g/value_nongreen_singleton_failsafe_v1_review.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nongreen-singleton-failsafe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[model-development]' pytest pyyaml

      - name: Prove preregistration and bounded scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=bf5313730c4fb8d118e63ae21b001e4952421d9a
          PREREG=c2ed014da80241a10f67c3c56b19b7783dcf82aa
          git cat-file -e "$BASE^{commit}"
          git cat-file -e "$PREREG^{commit}"
          git merge-base --is-ancestor "$PREREG" HEAD
          test -z "$(git diff --name-only "$PREREG"..HEAD -- docs/task05g_value_nongreen_singleton_failsafe_v1_preregistration.md)"
          git diff --name-only "$BASE"...HEAD | tee /tmp/singleton_paths.txt
          if grep -Ev '^(docs/task05g_value_nongreen_singleton_failsafe_v1_preregistration.md|scripts/task05g_value_nongreen_singleton_failsafe_v1.py|.github/workflows/task05g-value-nongreen-singleton-failsafe-v1.yml|reports/task05g/value_nongreen_singleton_failsafe_v1_review.md)$' /tmp/singleton_paths.txt | grep .; then
            echo 'ERROR: singleton fail-safe changed out-of-scope files.' >&2
            exit 1
          fi

      - name: Compile replay
        run: python -m py_compile scripts/task05g_value_nongreen_singleton_failsafe_v1.py

      - name: Run frozen focused tests
        run: |
          pytest -q \
            tests/value/test_task05f_*.py \
            tests/recommendation/test_task05g_policy.py \
            tests/recommendation/test_task05g_remediation_v1.py \
            tests/recommendation/test_task05g_model_confidence_v2.py

      - name: Materialize frozen Task05F board
        run: python scripts/task05f_evaluator_final_runner.py --out artifacts/task05g_value_nongreen_singleton/upstream

      - name: Verify 2025 firewall
        run: |
          python - <<'PY'
          import polars as pl
          board=pl.read_parquet('artifacts/task05g_value_nongreen_singleton/upstream/historical_evaluator_board.parquet')
          discovery=pl.read_csv('reports/task05e_remediated/market_edge_discovery_corrected_ledger_v1.csv', infer_schema_length=10000)
          confirmation=pl.read_csv('reports/task05e_remediated/market_edge_confirmation_corrected_ledger_v1.csv', infer_schema_length=10000)
          b={int(x) for x in board['season'].unique().to_list()}
          d={int(x) for x in discovery['season'].unique().to_list()}
          c={int(x) for x in confirmation['season'].unique().to_list()}
          assert b == {2020,2021,2022,2023,2024}
          assert d == {2020,2021,2022}
          assert c == {2023,2024}
          assert 2025 not in b | d | c
          PY

      - name: Reproduce Model Confidence V2
        run: |
          python scripts/task05g_model_confidence_v2_entrypoint.py \
            --root . \
            --board artifacts/task05g_value_nongreen_singleton/upstream/historical_evaluator_board.parquet \
            --out artifacts/task05g_value_nongreen_singleton/v2

      - name: Reproduce Spread Confidence V3
        run: |
          python scripts/task05g_spread_confidence_v3_runner.py \
            --root . \
            --v2-candidates artifacts/task05g_value_nongreen_singleton/v2/v2_candidate_table.parquet \
            --out artifacts/task05g_value_nongreen_singleton/v3

      - name: Run replay twice
        run: |
          python scripts/task05g_value_nongreen_singleton_failsafe_v1.py \
            --root . \
            --v3-candidates artifacts/task05g_value_nongreen_singleton/v3/v3_candidate_table.parquet \
            --out artifacts/task05g_value_nongreen_singleton/run_a
          python scripts/task05g_value_nongreen_singleton_failsafe_v1.py \
            --root . \
            --v3-candidates artifacts/task05g_value_nongreen_singleton/v3/v3_candidate_table.parquet \
            --out artifacts/task05g_value_nongreen_singleton/run_b

      - name: Prove deterministic replay
        run: |
          cmp artifacts/task05g_value_nongreen_singleton/run_a/task05g_value_nongreen_singleton_failsafe_v1_scorecard.json artifacts/task05g_value_nongreen_singleton/run_b/task05g_value_nongreen_singleton_failsafe_v1_scorecard.json
          cmp artifacts/task05g_value_nongreen_singleton/run_a/task05g_value_nongreen_singleton_failsafe_v1_trajectory.csv artifacts/task05g_value_nongreen_singleton/run_b/task05g_value_nongreen_singleton_failsafe_v1_trajectory.csv
          cmp artifacts/task05g_value_nongreen_singleton/run_a/task05g_value_nongreen_singleton_failsafe_v1_removed.csv artifacts/task05g_value_nongreen_singleton/run_b/task05g_value_nongreen_singleton_failsafe_v1_removed.csv

      - name: Validate frozen invariants
        run: |
          python - <<'PY'
          import json
          s=json.load(open('artifacts/task05g_value_nongreen_singleton/run_a/task05g_value_nongreen_singleton_failsafe_v1_scorecard.json'))
          assert s['preregistration_commit'] == 'c2ed014da80241a10f67c3c56b19b7783dcf82aa'
          assert s['sealed'] == [2025]
          assert s['production_promotion_allowed'] is False
          assert s['invariants']['only_nongreen_singleton_spread_to_pass'] is True
          assert s['invariants']['no_ml_backfill'] is True
          assert s['invariants']['no_new_plays'] is True
          for season in ('2020','2021','2022','2023','2024'):
              b=s['by_season'][season]['baseline_pareto_value']
              f=s['by_season'][season]['failsafe']
              assert f['plays'] <= b['plays']
              assert f['market_mix']['moneyline'] == b['market_mix']['moneyline']
              assert f['market_mix']['spread'] <= b['market_mix']['spread']
              assert f['market_mix']['total'] == 0
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task05g-value-nongreen-singleton-failsafe-${{ github.sha }}
          path: |
            artifacts/task05g_value_nongreen_singleton/run_a/
            artifacts/task05g_value_nongreen_singleton/v3/scorecard.json
            artifacts/task05g_value_nongreen_singleton/v2/scorecard.json
            artifacts/task05g_value_nongreen_singleton/upstream/scorecard.json
          if-no-files-found: error
