name: Materialize Frontend V1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/frontend-api-pwa-v1
          fetch-depth: 0
      - name: Reconstruct verified source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/frontend-v1/part_* > /tmp/nfl-front-v1-source.tar.gz.b64
          base64 -d /tmp/nfl-front-v1-source.tar.gz.b64 > /tmp/nfl-front-v1-source.tar.gz
          echo '726cce0f95baf8f9c33b161d9ac44d03ed3161312a3e1839a32dbe3f0a0545a3  /tmp/nfl-front-v1-source.tar.gz' | sha256sum -c -
          tar -tzf /tmp/nfl-front-v1-source.tar.gz
          tar -xzf /tmp/nfl-front-v1-source.tar.gz -C .
      - name: Remove branch-only transport and commit source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/materialize-frontend-v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m 'Integrate frontend API and PWA V1'
          git push origin HEAD:feat/frontend-api-pwa-v1
