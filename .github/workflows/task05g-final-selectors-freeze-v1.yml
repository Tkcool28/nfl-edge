name: Task05G Final Selectors Freeze V1

on:
  pull_request:
    paths:
      - 'src/nfl_edge/recommendation/final_selectors_v1.py'
      - 'config/task05g_final_selectors_v1.yaml'
      - 'tests/recommendation/test_task05g_final_selectors_v1.py'
      - 'scripts/task05g_final_selectors_freeze_v1.py'
      - 'docs/task05g_final_selector_freeze_v1.md'
      - 'reports/task05g/final_selector_freeze_v1_review.md'
      - '.github/workflows/task05g-final-selectors-freeze-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-selector-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[model-development]' pytest pyyaml

      - name: Prove frozen implementation ancestry
        shell: bash
        run: |
          set -euo pipefail
          FREEZE=afa92dc1d8c3cab3622013b82161331aa4d87feb
          git cat-file -e "$FREEZE^{commit}"
          git merge-base --is-ancestor "$FREEZE" HEAD
          # Selector semantics and integrated replay are frozen at FREEZE.
          # Test/workflow-only corrections may follow when CI exposes a fixture defect.
          test -z "$(git diff --name-only "$FREEZE"..HEAD -- src/nfl_edge/recommendation/final_selectors_v1.py config/task05g_final_selectors_v1.yaml scripts/task05g_final_selectors_freeze_v1.py)"

      - name: Compile canonical selector and replay
        run: |
          python -m py_compile src/nfl_edge/recommendation/final_selectors_v1.py
          python -m py_compile scripts/task05g_final_selectors_freeze_v1.py

      - name: Run final-selector tests
        run: |
          pytest -q tests/recommendation/test_task05g_final_selectors_v1.py

      - name: Run frozen upstream focused tests
        run: |
          pytest -q \
            tests/value/test_task05f_*.py \
            tests/recommendation/test_task05g_model_confidence_v2.py

      - name: Materialize frozen Task05F board
        run: python scripts/task05f_evaluator_final_runner.py --out artifacts/task05g_final_selector_freeze/upstream

      - name: Verify 2025 firewall
        run: |
          python - <<'PY'
          import polars as pl
          board=pl.read_parquet('artifacts/task05g_final_selector_freeze/upstream/historical_evaluator_board.parquet')
          discovery=pl.read_csv('reports/task05e_remediated/market_edge_discovery_corrected_ledger_v1.csv', infer_schema_length=10000)
          confirmation=pl.read_csv('reports/task05e_remediated/market_edge_confirmation_corrected_ledger_v1.csv', infer_schema_length=10000)
          b={int(x) for x in board['season'].unique().to_list()}
          d={int(x) for x in discovery['season'].unique().to_list()}
          c={int(x) for x in confirmation['season'].unique().to_list()}
          assert b == {2020,2021,2022,2023,2024}
          assert d == {2020,2021,2022}
          assert c == {2023,2024}
          assert 2025 not in b | d | c
          PY

      - name: Reproduce Model Confidence V2
        run: |
          python scripts/task05g_model_confidence_v2_entrypoint.py \
            --root . \
            --board artifacts/task05g_final_selector_freeze/upstream/historical_evaluator_board.parquet \
            --out artifacts/task05g_final_selector_freeze/v2

      - name: Reproduce Spread Confidence V3
        run: |
          python scripts/task05g_spread_confidence_v3_runner.py \
            --root . \
            --v2-candidates artifacts/task05g_final_selector_freeze/v2/v2_candidate_table.parquet \
            --out artifacts/task05g_final_selector_freeze/v3

      - name: Replay canonical selectors twice
        run: |
          python scripts/task05g_final_selectors_freeze_v1.py \
            --root . \
            --v3-candidates artifacts/task05g_final_selector_freeze/v3/v3_candidate_table.parquet \
            --out artifacts/task05g_final_selector_freeze/run_a
          python scripts/task05g_final_selectors_freeze_v1.py \
            --root . \
            --v3-candidates artifacts/task05g_final_selector_freeze/v3/v3_candidate_table.parquet \
            --out artifacts/task05g_final_selector_freeze/run_b

      - name: Prove deterministic replay
        run: |
          cmp artifacts/task05g_final_selector_freeze/run_a/task05g_final_selectors_v1_scorecard.json artifacts/task05g_final_selector_freeze/run_b/task05g_final_selectors_v1_scorecard.json
          cmp artifacts/task05g_final_selector_freeze/run_a/task05g_final_selectors_v1_rows.csv artifacts/task05g_final_selector_freeze/run_b/task05g_final_selectors_v1_rows.csv
          cmp artifacts/task05g_final_selector_freeze/run_a/task05g_final_selectors_v1_trust.csv artifacts/task05g_final_selector_freeze/run_b/task05g_final_selectors_v1_trust.csv

      - name: Validate frozen selector invariants
        run: |
          python - <<'PY'
          import json
          s=json.load(open('artifacts/task05g_final_selector_freeze/run_a/task05g_final_selectors_v1_scorecard.json'))
          assert s['sealed'] == [2025]
          assert s['invariants']['no_2025'] is True
          assert s['invariants']['totals_excluded'] is True
          for period in ('development','locked_diagnostic','overall'):
              for lane in ('hit_rate','balanced','value'):
                  assert s['periods'][period][lane]['market_mix']['total'] == 0
          PY

      - name: Upload integrated freeze evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task05g-final-selectors-freeze-${{ github.sha }}
          path: |
            artifacts/task05g_final_selector_freeze/run_a/
            artifacts/task05g_final_selector_freeze/v3/scorecard.json
            artifacts/task05g_final_selector_freeze/v2/scorecard.json
            artifacts/task05g_final_selector_freeze/upstream/scorecard.json
          if-no-files-found: error