name: Task05G Final Selector Bounded Audit

on:
  pull_request:
    branches:
      - feat/task05g-hhr-model-market-corroboration-v1
    paths:
      - 'docs/task05g_final_selector_architecture.md'
      - 'docs/task05g_final_selector_bounded_audit_preregistration.md'
      - 'scripts/task05g_final_selector_bounded_audit.py'
      - '.github/workflows/task05g-final-selector-bounded-audit.yml'
      - 'reports/task05g/final_selector_bounded_audit_review.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-selector-bounded-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[model-development]' pytest pyyaml

      - name: Enforce bounded scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=df8b6e1f75ae0eda4627d5228562f29df60636ff
          ARCH=0aec344d800d7c7ab3d9f76b1ff31975ddfd54cc
          PREREG=79dda37f50136ea606da027256915f4931205e32
          git cat-file -e "$BASE^{commit}"
          git cat-file -e "$ARCH^{commit}"
          git cat-file -e "$PREREG^{commit}"
          git merge-base --is-ancestor "$ARCH" HEAD
          git merge-base --is-ancestor "$PREREG" HEAD
          git diff --name-only "$BASE"...HEAD | tee /tmp/final_selector_paths.txt
          if grep -Ev '^(docs/task05g_final_selector_architecture.md|docs/task05g_final_selector_bounded_audit_preregistration.md|scripts/task05g_final_selector_bounded_audit.py|.github/workflows/task05g-final-selector-bounded-audit.yml|reports/task05g/final_selector_bounded_audit_review.md)$' /tmp/final_selector_paths.txt | grep .; then
            echo 'ERROR: final selector audit changed out-of-scope files.' >&2
            exit 1
          fi

      - name: Compile bounded audit
        run: python -m py_compile scripts/task05g_final_selector_bounded_audit.py

      - name: Run frozen focused tests
        run: |
          pytest -q \
            tests/value/test_task05f_*.py \
            tests/recommendation/test_task05g_policy.py \
            tests/recommendation/test_task05g_remediation_v1.py \
            tests/recommendation/test_task05g_model_confidence_v2.py

      - name: Materialize frozen Task05F board
        run: python scripts/task05f_evaluator_final_runner.py --out artifacts/task05g_final_selector/upstream

      - name: Verify 2025 firewall upstream
        run: |
          python - <<'PY'
          import polars as pl
          paths=[
            'artifacts/task05g_final_selector/upstream/historical_evaluator_board.parquet',
            'reports/task05e_remediated/market_edge_discovery_corrected_ledger_v1.csv',
            'reports/task05e_remediated/market_edge_confirmation_corrected_ledger_v1.csv',
          ]
          for path in paths:
              df=pl.read_parquet(path) if path.endswith('.parquet') else pl.read_csv(path, infer_schema_length=10000)
              seasons={int(x) for x in df['season'].unique().to_list()}
              assert seasons == {2020,2021,2022,2023,2024}, (path, seasons)
              assert 2025 not in seasons
          PY

      - name: Reproduce frozen V2 candidate table
        run: |
          python scripts/task05g_model_confidence_v2_entrypoint.py \
            --root . \
            --board artifacts/task05g_final_selector/upstream/historical_evaluator_board.parquet \
            --out artifacts/task05g_final_selector/v2

      - name: Reproduce Spread Confidence V3
        run: |
          python scripts/task05g_spread_confidence_v3_runner.py \
            --root . \
            --v2-candidates artifacts/task05g_final_selector/v2/v2_candidate_table.parquet \
            --out artifacts/task05g_final_selector/v3

      - name: Run bounded audit twice
        run: |
          python scripts/task05g_final_selector_bounded_audit.py \
            --root . \
            --v3-candidates artifacts/task05g_final_selector/v3/v3_candidate_table.parquet \
            --out artifacts/task05g_final_selector/run_a
          python scripts/task05g_final_selector_bounded_audit.py \
            --root . \
            --v3-candidates artifacts/task05g_final_selector/v3/v3_candidate_table.parquet \
            --out artifacts/task05g_final_selector/run_b

      - name: Prove deterministic replay
        run: |
          cmp artifacts/task05g_final_selector/run_a/task05g_final_selector_bounded_audit.json artifacts/task05g_final_selector/run_b/task05g_final_selector_bounded_audit.json
          cmp artifacts/task05g_final_selector/run_a/task05g_final_selector_selected_rows.csv artifacts/task05g_final_selector/run_b/task05g_final_selector_selected_rows.csv

      - name: Validate frozen invariants
        run: |
          python - <<'PY'
          import json
          s=json.load(open('artifacts/task05g_final_selector/run_a/task05g_final_selector_bounded_audit.json'))
          assert s['architecture_commit'] == '0aec344d800d7c7ab3d9f76b1ff31975ddfd54cc'
          assert s['preregistration_commit'] == '79dda37f50136ea606da027256915f4931205e32'
          assert s['periods']['sealed'] == [2025]
          assert s['coefficients'] == {'balanced_t050':0.5,'hhr_half_shrink':0.5}
          assert s['protocol']['hhr']['ev_status_used'] is False
          assert s['protocol']['balanced']['ev_status_used'] is False
          assert s['protocol']['value']['strict_positive_ev'] is True
          for lane in ('hhr','balanced'):
              for phase in ('development','locked_diagnostic','overall'):
                  assert s['lanes'][lane][phase]['coverage_parity'] is True
                  assert s['lanes'][lane][phase]['primary']['market_mix']['total'] == 0
          assert s['production_promotion_allowed'] is False
          PY

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task05g-final-selector-bounded-audit-${{ github.sha }}
          path: |
            artifacts/task05g_final_selector/run_a/
            artifacts/task05g_final_selector/v3/scorecard.json
            artifacts/task05g_final_selector/v2/scorecard.json
            artifacts/task05g_final_selector/upstream/scorecard.json
          if-no-files-found: error
