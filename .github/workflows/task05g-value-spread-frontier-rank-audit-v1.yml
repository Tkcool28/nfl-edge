name: Task05G Value Spread Frontier Rank Audit V1

on:
  pull_request:
    branches:
      - feat/task05g-final-selector-candidate-v1
    paths:
      - 'docs/task05g_value_spread_frontier_rank_audit_v1_preregistration.md'
      - 'scripts/task05g_value_spread_frontier_rank_audit_v1.py'
      - '.github/workflows/task05g-value-spread-frontier-rank-audit-v1.yml'
      - 'reports/task05g/value_spread_frontier_rank_audit_v1_review.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spread-frontier-rank-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[model-development]' pytest pyyaml

      - name: Prove preregistration and audit-only scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=b93b21a11091411a4c35def40ca704a2aaf858d3
          PREREG=5501ce6f2aefb6db48ad253d99f5ea93a4449712
          git cat-file -e "$BASE^{commit}"
          git cat-file -e "$PREREG^{commit}"
          git merge-base --is-ancestor "$PREREG" HEAD
          test -z "$(git diff --name-only "$PREREG"..HEAD -- docs/task05g_value_spread_frontier_rank_audit_v1_preregistration.md)"
          git diff --name-only "$BASE"...HEAD | tee /tmp/spread_rank_paths.txt
          if grep -Ev '^(docs/task05g_value_spread_frontier_rank_audit_v1_preregistration.md|scripts/task05g_value_spread_frontier_rank_audit_v1.py|.github/workflows/task05g-value-spread-frontier-rank-audit-v1.yml|reports/task05g/value_spread_frontier_rank_audit_v1_review.md)$' /tmp/spread_rank_paths.txt | grep .; then
            echo 'ERROR: spread frontier rank audit changed out-of-scope files.' >&2
            exit 1
          fi

      - name: Compile audit
        run: python -m py_compile scripts/task05g_value_spread_frontier_rank_audit_v1.py

      - name: Run frozen focused tests
        run: |
          pytest -q \
            tests/value/test_task05f_*.py \
            tests/recommendation/test_task05g_policy.py \
            tests/recommendation/test_task05g_remediation_v1.py \
            tests/recommendation/test_task05g_model_confidence_v2.py

      - name: Materialize frozen Task05F board
        run: python scripts/task05f_evaluator_final_runner.py --out artifacts/task05g_spread_rank/upstream

      - name: Verify 2025 firewall
        run: |
          python - <<'PY'
          import polars as pl
          board=pl.read_parquet('artifacts/task05g_spread_rank/upstream/historical_evaluator_board.parquet')
          discovery=pl.read_csv('reports/task05e_remediated/market_edge_discovery_corrected_ledger_v1.csv', infer_schema_length=10000)
          confirmation=pl.read_csv('reports/task05e_remediated/market_edge_confirmation_corrected_ledger_v1.csv', infer_schema_length=10000)
          b={int(x) for x in board['season'].unique().to_list()}
          d={int(x) for x in discovery['season'].unique().to_list()}
          c={int(x) for x in confirmation['season'].unique().to_list()}
          assert b == {2020,2021,2022,2023,2024}
          assert d == {2020,2021,2022}
          assert c == {2023,2024}
          assert 2025 not in b | d | c
          PY

      - name: Reproduce Model Confidence V2
        run: |
          python scripts/task05g_model_confidence_v2_entrypoint.py \
            --root . \
            --board artifacts/task05g_spread_rank/upstream/historical_evaluator_board.parquet \
            --out artifacts/task05g_spread_rank/v2

      - name: Reproduce Spread Confidence V3
        run: |
          python scripts/task05g_spread_confidence_v3_runner.py \
            --root . \
            --v2-candidates artifacts/task05g_spread_rank/v2/v2_candidate_table.parquet \
            --out artifacts/task05g_spread_rank/v3

      - name: Run rank audit twice
        run: |
          python scripts/task05g_value_spread_frontier_rank_audit_v1.py \
            --root . \
            --v3-candidates artifacts/task05g_spread_rank/v3/v3_candidate_table.parquet \
            --out artifacts/task05g_spread_rank/run_a
          python scripts/task05g_value_spread_frontier_rank_audit_v1.py \
            --root . \
            --v3-candidates artifacts/task05g_spread_rank/v3/v3_candidate_table.parquet \
            --out artifacts/task05g_spread_rank/run_b

      - name: Prove deterministic replay
        run: |
          cmp artifacts/task05g_spread_rank/run_a/task05g_value_spread_frontier_rank_audit_v1.json artifacts/task05g_spread_rank/run_b/task05g_value_spread_frontier_rank_audit_v1.json
          cmp artifacts/task05g_spread_rank/run_a/task05g_value_spread_frontier_rank_2023.csv artifacts/task05g_spread_rank/run_b/task05g_value_spread_frontier_rank_2023.csv

      - name: Validate frozen invariants
        run: |
          python - <<'PY'
          import json
          r=json.load(open('artifacts/task05g_spread_rank/run_a/task05g_value_spread_frontier_rank_audit_v1.json'))
          assert r['preregistration_commit'] == '5501ce6f2aefb6db48ad253d99f5ea93a4449712'
          assert r['periods']['sealed'] == [2025]
          assert r['promotion_authorized'] is False
          assert r['overall']['population']['candidates'] >= r['overall']['ranks']['1']['candidates']
          assert r['by_season']['2023']['population']['candidates'] >= r['by_season']['2023']['ranks']['1']['candidates']
          PY

      - name: Upload forensic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task05g-value-spread-frontier-rank-audit-${{ github.sha }}
          path: |
            artifacts/task05g_spread_rank/run_a/
            artifacts/task05g_spread_rank/v3/scorecard.json
            artifacts/task05g_spread_rank/v2/scorecard.json
            artifacts/task05g_spread_rank/upstream/scorecard.json
          if-no-files-found: error
