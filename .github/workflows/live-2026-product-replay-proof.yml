name: Zero-Credit 2026 Live Product Replay Proof

on:
  push:
    branches:
      - feat/2026-live-market-product-snapshot-v1

permissions:
  contents: read
  actions: read

jobs:
  replay-proof:
    if: github.event.head_commit.message == 'Complete zero-credit replay proof from saved live bytes'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      OPENBLAS_CORETYPE: "HASWELL"
      MKL_NUM_THREADS: "1"
      MKL_CBWR: "COMPATIBLE"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install accepted runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[model-development]' pyyaml 'jsonschema>=4.23,<5' \
            'numpy==2.4.2' 'scipy==1.17.1' 'scikit-learn==1.8.0'

      - name: Prove replay job has no Odds API credential
        run: |
          test -z "${ODDS_API_KEY:-}"
          echo 'ODDS_API_KEY_ABSENT_REPLAY_ONLY'

      - uses: actions/download-artifact@v4
        with:
          name: live-2026-product-one-shot-c350f438919d44e28027556fd67a917768fdb12c
          path: artifacts/live_2026_product
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 33797904103

      - name: Verify exact paid capture and live output identities
        run: |
          set -euo pipefail
          RAW="$(find artifacts/live_2026_product/live/raw -maxdepth 1 -type f -name 'odds-api-nfl-week1-*.json' ! -name '*.meta.json' -print -quit)"
          META="${RAW%.json}.meta.json"
          test -f "$RAW" && test -f "$META"
          python - "$RAW" "$META" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          raw=Path(sys.argv[1]); meta=Path(sys.argv[2])
          payload=json.loads(meta.read_text())
          assert hashlib.sha256(raw.read_bytes()).hexdigest() == '1bb959f64ede17c4b5fe29aad78f60abe6a8cc57fae716200b3e5ccf714644a5'
          assert payload['response_sha256'] == '1bb959f64ede17c4b5fe29aad78f60abe6a8cc57fae716200b3e5ccf714644a5'
          assert payload['credits_consumed'] == 3
          assert payload['credits_used_total'] == 3
          assert payload['credits_remaining'] == 19997
          assert payload['automatic_retries'] == 0
          assert payload['expected_credit_cost'] == 3
          print('PAID_CAPTURE_IDENTITY=PASS')
          PY
          echo '492d87a3f58ccaf48ed3f2698deea50ad30cab135f6726d241d7061cac98491d  artifacts/live_2026_product/live/NFL_EDGE_PRODUCT_API_V1.json' | sha256sum --check --strict
          echo '17a602add9b481e4c385092ec93bcd92e29a6b10a0091a6c1da15b96bd72c9bf  artifacts/live_2026_product/live/NFL_EDGE_LIVE_MARKET_V1.json' | sha256sum --check --strict
          echo 'a7cedab124c8debdf4af01f382c5ce944b109bec68f230c135fe4b7f2bce56c9  artifacts/live_2026_product/football/week1_football_snapshot.json' | sha256sum --check --strict

      - name: Replay exact saved raw bytes twice with no credential
        run: |
          set -euo pipefail
          test -z "${ODDS_API_KEY:-}"
          RAW="$(find artifacts/live_2026_product/live/raw -maxdepth 1 -type f -name 'odds-api-nfl-week1-*.json' ! -name '*.meta.json' -print -quit)"
          META="${RAW%.json}.meta.json"
          for n in a b; do
            mkdir -p "artifacts/live_2026_product/replay_${n}"
            python scripts/run_2026_live_market_product_snapshot_v1.py \
              --football-snapshot artifacts/live_2026_product/football/week1_football_snapshot.json \
              --decision-state data/live/2026/entering_product_state_v1.json \
              --output-dir "artifacts/live_2026_product/replay_${n}" \
              --market-response "$RAW" \
              --market-metadata "$META" \
              | tee "artifacts/live_2026_product/replay_${n}/run.log"
          done
          cmp artifacts/live_2026_product/live/NFL_EDGE_LIVE_MARKET_V1.json artifacts/live_2026_product/replay_a/NFL_EDGE_LIVE_MARKET_V1.json
          cmp artifacts/live_2026_product/replay_a/NFL_EDGE_LIVE_MARKET_V1.json artifacts/live_2026_product/replay_b/NFL_EDGE_LIVE_MARKET_V1.json
          cmp artifacts/live_2026_product/live/NFL_EDGE_PRODUCT_API_V1.json artifacts/live_2026_product/replay_a/NFL_EDGE_PRODUCT_API_V1.json
          cmp artifacts/live_2026_product/replay_a/NFL_EDGE_PRODUCT_API_V1.json artifacts/live_2026_product/replay_b/NFL_EDGE_PRODUCT_API_V1.json
          echo 'ZERO_CREDIT_REPLAY_TWICE=PASS'

      - name: Validate schema and emit final live-proof summary
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          from nfl_edge.contracts.product_api_v1 import validate_product_snapshot
          root=Path.cwd(); base=root/'artifacts/live_2026_product'
          product_path=base/'live/NFL_EDGE_PRODUCT_API_V1.json'
          market_path=base/'live/NFL_EDGE_LIVE_MARKET_V1.json'
          football_path=base/'football/week1_football_snapshot.json'
          product=json.loads(product_path.read_text())
          proof=json.loads((base/'live/proof.json').read_text())
          raw=next((base/'live/raw').glob('odds-api-nfl-week1-*.json'))
          if raw.name.endswith('.meta.json'):
              raw=next(p for p in (base/'live/raw').glob('odds-api-nfl-week1-*.json') if not p.name.endswith('.meta.json'))
          meta=json.loads(raw.with_suffix('.meta.json').read_text())
          validate_product_snapshot(product)
          schema=json.loads((root/'schemas/NFL_EDGE_PRODUCT_API_V1.schema.json').read_text())
          Draft202012Validator(schema).validate(product)
          summary={
              'verdict':'ONE_SHOT_LIVE_PROOF_COMPLETE',
              'acquired_at_utc':meta['acquired_at_utc'],
              'live_billable_requests':1,
              'credits_consumed':meta['credits_consumed'],
              'credits_used_total':meta['credits_used_total'],
              'credits_remaining':meta['credits_remaining'],
              'automatic_retries':meta['automatic_retries'],
              'provider_events':proof['provider_events'],
              'canonical_game_matches':proof['canonical_game_matches'],
              'coverage_by_book':proof['coverage_by_book'],
              'coverage_by_market':proof['coverage_by_market'],
              'unmatched_provider_events':proof['unmatched_provider_events'],
              'unmatched_canonical_games':proof['unmatched_canonical_games'],
              'ambiguous_provider_events':proof['ambiguous_provider_events'],
              'duplicate_mappings':proof['duplicate_mappings'],
              'exact_duplicates':proof['exact_duplicates'],
              'evaluator_by_market':proof['evaluator_by_market'],
              'evaluator_supported_by_market':proof['evaluator_supported_by_market'],
              'headline_states':proof['headline_states'],
              'roof_downstream_counts':proof['roof_downstream_counts'],
              'schema_validation':'PASS',
              'product_sha256':hashlib.sha256(product_path.read_bytes()).hexdigest(),
              'market_file_sha256':hashlib.sha256(market_path.read_bytes()).hexdigest(),
              'market_snapshot_sha256':proof['market_snapshot_sha256'],
              'football_sha256':hashlib.sha256(football_path.read_bytes()).hexdigest(),
              'market_response_sha256':meta['response_sha256'],
              'deterministic_live_internal_replay':proof['deterministic_replay'],
              'zero_credit_saved_raw_replay_twice':'PASS',
              'replay_additional_market_api_calls':0,
              'methodology_changed':False,
              'evaluator_methodology_changed':False,
              'selector_methodology_changed':False,
              'staking_methodology_changed':False,
          }
          (base/'one_shot_summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-2026-product-final-proof-${{ github.sha }}
          path: artifacts/live_2026_product/
          if-no-files-found: error
          retention-days: 90
