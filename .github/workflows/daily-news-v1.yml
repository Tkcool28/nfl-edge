name: Daily News V1

on:
  pull_request:
    paths:
      - "src/nfl_edge/news/**"
      - "scripts/nfl_edge_daily_news_v1.py"
      - "tests/news/**"
      - "news/**"
      - "deploy/nfl-edge-news.env.example"
      - "deploy/systemd/nfl-edge-daily-news.*"
      - "deploy/nfl-edge-backend.env.example"
      - ".github/workflows/daily-news-v1.yml"
  push:
    branches: [main]
    paths:
      - "src/nfl_edge/news/**"
      - "scripts/nfl_edge_daily_news_v1.py"
      - "tests/news/**"
      - "news/**"
      - "deploy/nfl-edge-news.env.example"
      - "deploy/systemd/nfl-edge-daily-news.*"
      - "deploy/nfl-edge-backend.env.example"
      - ".github/workflows/daily-news-v1.yml"
  workflow_dispatch:

jobs:
  daily-news-v1:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest 'jsonschema>=4.23,<5'
      - name: Compile News entry points
        run: |
          python -m py_compile src/nfl_edge/news/pipeline_v1.py scripts/nfl_edge_daily_news_v1.py
      - name: Prove News code contains no sportsbook acquisition calls
        run: |
          if grep -R -n -E 'api\.the-odds-api\.com|THE_ODDS_API_KEY|odds_api_key' src/nfl_edge/news scripts/nfl_edge_daily_news_v1.py; then
            echo "News pipeline must not call paid sportsbook providers"
            exit 1
          fi
      - name: Run Daily News acceptance suite
        run: |
          PYTHONPATH=src pytest -q tests/news
      - name: Validate systemd cadence contract
        run: |
          grep -F '06:20:00 America/Denver' deploy/systemd/nfl-edge-daily-news.timer
          grep -F '18:20:00 America/Denver' deploy/systemd/nfl-edge-daily-news.timer
          grep -F 'ReadWritePaths=/var/lib/nfl-edge/news_v1' deploy/systemd/nfl-edge-daily-news.service
