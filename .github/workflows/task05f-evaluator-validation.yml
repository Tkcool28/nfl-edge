name: Task05F Evaluator Validation

on:
  push:
    branches:
      - feat/task05f-evaluator-rebuild-v1
  pull_request:
    branches:
      - main
    paths:
      - 'src/nfl_edge/value/**'
      - 'src/nfl_edge/user/**'
      - 'scripts/task05f_*'
      - 'tests/value/**'
      - 'config/task05f_*.yaml'
      - 'docs/task05f_*.md'
      - '.github/workflows/task05f-evaluator-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluator-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install evaluator test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[model-development]' pytest scipy pyyaml

      - name: Enforce evaluator-only scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=3ed8d740a88b59d46e27e206f39757307a6a13da
          git cat-file -e "$BASE^{commit}"
          git diff --name-only "$BASE"...HEAD | tee /tmp/task05f_changed_paths.txt
          if grep -E '^(src/nfl_edge/models/|src/nfl_edge/backtest/expected_margin|data/modeling/|data/frozen/|reports/task05d/|reports/task05e_remediated/|config/expected_margin|config/.*qb|config/.*xgb)' /tmp/task05f_changed_paths.txt; then
            echo 'ERROR: Task05F modified frozen football-model/data scope.' >&2
            exit 1
          fi

      - name: Record post-selector development provenance
        shell: bash
        run: |
          mkdir -p artifacts/task05f
          printf '{\n  "commit": "%s",\n  "base": "%s",\n  "scope": "post_selector_staking_contract_development",\n  "sealed_season": 2025,\n  "historical_play_through_scoring": "DISABLED_ON_ORDINARY_PUSHES",\n  "historical_selector_v1_scoring": "DISABLED_ON_ORDINARY_PUSHES",\n  "historical_selector_v2_scoring": "DISABLED_ON_ORDINARY_PUSHES",\n  "historical_selector_v3_scoring": "DISABLED",\n  "historical_staking_bankroll_simulation": "DISABLED",\n  "selector_v3_2020_2024_outcome_acceptance": false\n}\n' \
            "$GITHUB_SHA" \
            '3ed8d740a88b59d46e27e206f39757307a6a13da' \
            > artifacts/task05f/ci_provenance.json
          cp /tmp/task05f_changed_paths.txt artifacts/task05f/changed_paths.txt
          sha256sum config/task05f_evaluator_locked_v1.yaml > artifacts/task05f/locked_config_sha256.txt
          sha256sum config/task05f_reliability_uncertainty_v1_1_prereg.yaml > artifacts/task05f/phase_f_v1_1_prereg_sha256.txt
          sha256sum config/task05f_play_through_v1_1_prereg.yaml > artifacts/task05f/play_through_v1_1_prereg_sha256.txt
          sha256sum config/task05f_candidate_table_v1.yaml > artifacts/task05f/candidate_table_v1_sha256.txt
          sha256sum config/task05f_selectors_v1_prereg.yaml > artifacts/task05f/selectors_v1_prereg_sha256.txt
          sha256sum config/task05f_selectors_v1_implementation_lock.yaml > artifacts/task05f/selectors_v1_implementation_lock_sha256.txt
          sha256sum config/task05f_selectors_v1_historical_eval_lock.yaml > artifacts/task05f/selectors_v1_historical_eval_lock_sha256.txt
          sha256sum config/task05f_selectors_v2_prereg.yaml > artifacts/task05f/selectors_v2_prereg_sha256.txt
          sha256sum config/task05f_selectors_v3_capability_prereg.yaml > artifacts/task05f/selectors_v3_capability_prereg_sha256.txt
          sha256sum config/task05f_staking_v1.yaml > artifacts/task05f/staking_v1_prereg_sha256.txt

      - name: Run Task05F value-layer tests
        run: pytest -q tests/value/

      - name: Compile downstream candidate selector and staking modules
        run: |
          python -m py_compile scripts/task05f_candidate_table_v1_runner.py
          python -m py_compile scripts/task05f_selectors_v1_runner.py
          python -m py_compile scripts/task05f_selectors_v2_runner.py
          python -m py_compile src/nfl_edge/value/selectors_v3.py
          python -m py_compile src/nfl_edge/value/staking.py
          python -m py_compile src/nfl_edge/user/staking_profile.py
          python - <<'PY'
          from nfl_edge.value.selectors import select_primary_cards
          from nfl_edge.value.selectors_v2 import football_signal_support, select_primary_cards_v2
          from nfl_edge.value.selectors_v3 import select_primary_cards_v3
          from nfl_edge.value.staking import full_kelly_fraction, recommend_stake
          from nfl_edge.user.staking_profile import UserStakingProfile
          assert callable(select_primary_cards)
          assert callable(football_signal_support)
          assert callable(select_primary_cards_v2)
          assert callable(select_primary_cards_v3)
          assert callable(full_kelly_fraction)
          assert callable(recommend_stake)
          assert UserStakingProfile is not None
          print('selector_v1_import=PASS')
          print('selector_v2_import=PASS')
          print('selector_v3_import=PASS')
          print('staking_v1_import=PASS')
          PY

      - name: Verify frozen post-probability selector and staking contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'sealed_seasons: \[2025\]' config/task05f_play_through_v1_1_prereg.yaml
          grep -q 'maximum_break_even_concession: 0.015' config/task05f_play_through_v1_1_prereg.yaml
          grep -q 'expected_rows_for_frozen_2020_2024_fixture: 8448' config/task05f_candidate_table_v1.yaml
          grep -q 'status: PREREGISTERED_BEFORE_SELECTOR_HISTORICAL_SCORING' config/task05f_selectors_v1_prereg.yaml
          grep -q 'status: PREREGISTERED_BEFORE_V2_HISTORICAL_SCORING' config/task05f_selectors_v2_prereg.yaml
          grep -q 'status: PREREGISTERED_AFTER_V1_V2_EVIDENCE_BEFORE_V3_OR_2025_OUTCOME_SCORING' config/task05f_selectors_v3_capability_prereg.yaml
          grep -q 'currently_eligible_markets: \[spread\]' config/task05f_selectors_v3_capability_prereg.yaml
          grep -q 'raw_football_direction_is_primary_card_gate: false' config/task05f_selectors_v3_capability_prereg.yaml
          grep -q 'historical_roi_or_hit_rate_acceptance_on_2020_2024: false' config/task05f_selectors_v3_capability_prereg.yaml
          grep -q 'status: PREREGISTERED_BEFORE_ANY_STAKING_HISTORICAL_BANKROLL_SIMULATION' config/task05f_staking_v1.yaml
          grep -q 'probability_for_kelly: staking_probability' config/task05f_staking_v1.yaml
          grep -q 'hard_cap_fraction_of_bankroll: 0.05' config/task05f_staking_v1.yaml
          grep -q 'requires_price_status: VALUE' config/task05f_staking_v1.yaml
          grep -q 'playable_never_gets_kelly_stake: true' config/task05f_staking_v1.yaml
          grep -q 'fraction_of_bankroll: 0.01' config/task05f_staking_v1.yaml
          grep -q 'qualifying_price_status: \[VALUE, PLAYABLE\]' config/task05f_staking_v1.yaml
          grep -q 'no_kelly_fraction_tuning_from_roi: true' config/task05f_staking_v1.yaml
          grep -q 'no_2025: true' config/task05f_staking_v1.yaml
          echo 'historical_play_through_scoring=DISABLED'
          echo 'historical_selector_v1_scoring=DISABLED'
          echo 'historical_selector_v2_scoring=DISABLED'
          echo 'historical_selector_v3_outcome_scoring=DISABLED'
          echo 'historical_staking_bankroll_simulation=DISABLED'

      - name: Upload contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task05f-evaluator-contract-${{ github.sha }}
          path: artifacts/task05f/
          if-no-files-found: error
