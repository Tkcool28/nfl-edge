name: Task05F Evaluator Final Validation

on:
  push:
    branches:
      - feat/task05f-evaluator-freeze-v1
  pull_request:
    branches:
      - main
    paths:
      - 'src/nfl_edge/value/**'
      - 'scripts/task05f_evaluator_final_runner.py'
      - 'scripts/task05f_spread_contribution_diagnostic.py'
      - 'tests/value/test_task05f_*.py'
      - 'config/task05f_evaluator_final_v1.yaml'
      - 'docs/task05f_evaluator_final_v1.md'
      - '.github/workflows/task05f-evaluator-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluator-final:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[model-development]' pytest pyyaml

      - name: Enforce Task05F scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=eab5f719d8695df484f10cade39ee0322d2841fa
          git diff --name-only "$BASE"...HEAD | tee /tmp/task05f_paths.txt
          if grep -E '^(src/nfl_edge/models/|src/nfl_edge/backtest/|data/modeling/|data/frozen/|reports/task05d/|reports/task05e_remediated/)' /tmp/task05f_paths.txt; then
            echo 'ERROR: frozen model/data/evidence scope modified' >&2
            exit 1
          fi
          if grep -E '(^|/)(selectors|staking|staking_profile|evaluated_wager_board|product_simulation)' /tmp/task05f_paths.txt; then
            echo 'ERROR: selector/user-staking/product-simulation scope entered Task05F evaluator freeze' >&2
            exit 1
          fi

      - name: Run evaluator contract tests
        run: pytest -q tests/value/test_task05f_*.py

      - name: Compile runtime
        run: |
          python -m py_compile src/nfl_edge/value/*.py
          python -m py_compile scripts/task05f_evaluator_final_runner.py
          python -m py_compile scripts/task05f_spread_contribution_diagnostic.py

      - name: Run chronological evaluator twice
        run: |
          python scripts/task05f_evaluator_final_runner.py --out artifacts/task05f/final_a
          python scripts/task05f_evaluator_final_runner.py --out artifacts/task05f/final_b

      - name: Prove deterministic reproduction
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import polars as pl

          a=Path('artifacts/task05f/final_a')
          b=Path('artifacts/task05f/final_b')
          for name in [
              'scorecard.json','frozen_evaluator_state.json','state_by_block.ndjson',
              'reliability_table.csv','frozen_edge_preservation.json',
              'candidate_manifest.json'
          ]:
              assert a.joinpath(name).read_bytes() == b.joinpath(name).read_bytes(), name
          for name in ['historical_evaluator_board.parquet','candidate_table.parquet']:
              left=pl.read_parquet(a/name).sort(pl.read_parquet(a/name).columns)
              right=pl.read_parquet(b/name).sort(pl.read_parquet(b/name).columns)
              assert left.equals(right), name
          score=json.loads((a/'scorecard.json').read_text())
          assert score['sealed_season'] == 2025
          assert score['manual_offer_parity_checks'] > 0
          assert score['candidate_rows'] > 0
          print(json.dumps({
              'deterministic': True,
              'manual_offer_parity_checks': score['manual_offer_parity_checks'],
              'candidate_rows': score['candidate_rows'],
              'reliability': {m: score['markets'][m]['reliability'] for m in ['moneyline','spread','total']},
          }, indent=2))
          PY

      - name: Verify candidate outcome firewall
        run: |
          python - <<'PY'
          import polars as pl
          df=pl.read_parquet('artifacts/task05f/final_a/candidate_table.parquet')
          forbidden={'settlement','realized_profit','home_score','away_score'}
          assert not forbidden.intersection(df.columns)
          assert set(df['season'].unique().to_list()) == {2020,2021,2022,2023,2024}
          PY

      - name: Run read-only Spread V3 contribution diagnostic
        run: |
          python scripts/task05f_spread_contribution_diagnostic.py \
            --artifact-dir artifacts/task05f/final_a \
            --out artifacts/task05f/final_a/spread_contribution_diagnostic.json

      - name: Upload evaluator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task05f-evaluator-final-${{ github.sha }}
          path: artifacts/task05f/final_a/
          if-no-files-found: error
