name: Task05F Evaluator Validation

on:
  push:
    branches:
      - feat/task05f-evaluator-rebuild-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluator-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install evaluator test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[model-development]' pytest scipy pyyaml

      - name: Enforce evaluator-only scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=3ed8d740a88b59d46e27e206f39757307a6a13da
          git cat-file -e "$BASE^{commit}"
          git diff --name-only "$BASE"...HEAD | tee /tmp/task05f_changed_paths.txt
          if grep -E '^(src/nfl_edge/models/|src/nfl_edge/backtest/expected_margin|data/modeling/|data/frozen/|reports/task05d/|reports/task05e_remediated/|config/expected_margin|config/.*qb|config/.*xgb)' /tmp/task05f_changed_paths.txt; then
            echo 'ERROR: Task05F modified frozen football-model/data scope.' >&2
            exit 1
          fi

      - name: Record designated product V2 provenance
        shell: bash
        run: |
          mkdir -p artifacts/task05f/product_v2_evidence
          printf '{\n  "commit": "%s",\n  "pre_score_contract_sha": "%s",\n  "scope": "DESIGNATED_PRODUCT_SIMULATION_V2_DIAGNOSTIC",\n  "results_label": "OBSERVATIONAL_ONLY_NOT_TUNED",\n  "sealed_season": 2025,\n  "product_simulation_v1": "SUPERSEDED_NOT_EVIDENCE",\n  "may_tune_from_results": false\n}\n' \
            "$GITHUB_SHA" \
            'd9fa2e0e75c3d17be927e3a6f80ecbe4abf08ec8' \
            > artifacts/task05f/product_v2_evidence/designated_run_provenance.json
          sha256sum config/task05f_candidate_table_v1.yaml > artifacts/task05f/product_v2_evidence/candidate_config_sha256.txt
          sha256sum config/task05f_selectors_v3_1_product_prereg.yaml > artifacts/task05f/product_v2_evidence/selector_v3_1_sha256.txt
          sha256sum config/task05f_staking_v2_units_prereg.yaml > artifacts/task05f/product_v2_evidence/staking_v2_sha256.txt
          sha256sum config/task05f_product_simulation_v2.yaml > artifacts/task05f/product_v2_evidence/product_simulation_v2_sha256.txt

      - name: Run Task05F value-layer tests
        run: pytest -q tests/value/

      - name: Compile product V2 evidence stack
        run: |
          python -m py_compile scripts/task05f_candidate_table_v1_runner.py
          python -m py_compile src/nfl_edge/value/selectors_v3_1.py
          python -m py_compile src/nfl_edge/value/staking_v2.py
          python -m py_compile src/nfl_edge/user/staking_profile_v2.py
          python -m py_compile scripts/task05f_product_simulation_v2_runner.py

      - name: Verify preregistered designated evidence contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'status: PREREGISTERED_BEFORE_V3_1_OR_2025_OUTCOME_SCORING' config/task05f_selectors_v3_1_product_prereg.yaml
          grep -q 'duplicate_wager_across_primary_cards: false' config/task05f_selectors_v3_1_product_prereg.yaml
          grep -q 'status: PREREGISTERED_BEFORE_V2_UNIT_BANKROLL_SIMULATION' config/task05f_staking_v2_units_prereg.yaml
          grep -q 'maximum_units_per_wager: 2.0' config/task05f_staking_v2_units_prereg.yaml
          grep -q 'global_absolute_wager_cap_fraction: 0.05' config/task05f_staking_v2_units_prereg.yaml
          grep -q 'status: PREREGISTERED_BEFORE_V3_1_STAKING_V2_2020_2024_PRODUCT_SIMULATION' config/task05f_product_simulation_v2.yaml
          grep -q 'results_label: OBSERVATIONAL_ONLY_NOT_TUNED' config/task05f_product_simulation_v2.yaml
          grep -q 'bankroll_results_may_not_change_staking_v2: true' config/task05f_product_simulation_v2.yaml
          grep -q 'bankroll_results_may_not_change_selector_v3_1: true' config/task05f_product_simulation_v2.yaml
          grep -q 'no_2025: true' config/task05f_product_simulation_v2.yaml

      - name: Run designated product V2 simulation twice for determinism
        run: |
          rm -rf artifacts/task05f/product_v2_a artifacts/task05f/product_v2_b
          python scripts/task05f_product_simulation_v2_runner.py \
            --config config/task05f_product_simulation_v2.yaml \
            --out artifacts/task05f/product_v2_a
          python scripts/task05f_product_simulation_v2_runner.py \
            --config config/task05f_product_simulation_v2.yaml \
            --out artifacts/task05f/product_v2_b

      - name: Verify deterministic product V2 outputs and hard contracts
        shell: bash
        run: |
          set -euo pipefail
          diff -qr artifacts/task05f/product_v2_a artifacts/task05f/product_v2_b
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('artifacts/task05f/product_v2_a')
          score = json.loads((root / 'scorecard.json').read_text())
          diag = json.loads((root / 'diagnostics.json').read_text())
          repro = json.loads((root / 'candidate_reproduction.json').read_text())
          portfolio = json.loads((root / 'portfolio_bankroll.json').read_text())

          assert score['label'] == 'OBSERVATIONAL_ONLY_NOT_TUNED'
          assert score['development_seasons'] == [2020, 2021, 2022, 2023, 2024]
          assert score['sealed_seasons'] == [2025]
          assert score['total_slates'] == 109
          assert score['historical_roi_is_acceptance_gate'] is False
          assert score['historical_hit_rate_is_acceptance_gate'] is False
          assert score['may_tune_from_results'] is False
          assert repro['candidate_rows'] == 8448
          assert repro['candidate_rows_immutable'] is True
          assert repro['outcome_fields_in_candidate_table'] == []
          assert repro['selection_and_units_frozen_before_outcome_join'] is True
          assert diag['all_non_null_featured_candidate_ids_distinct'] is True

          pu = diag['playable_units']
          vu = diag['value_units']
          if pu['n']:
              assert 0.5 - 1e-12 <= pu['min'] <= pu['max'] <= 1.0 + 1e-12
          if vu['n']:
              assert 1.0 - 1e-12 <= vu['min'] <= vu['max'] <= 2.0 + 1e-12

          expected_profiles = {
              'CAUTIOUS_100', 'CONSERVATIVE_100', 'STANDARD_100',
              'AGGRESSIVE_100', 'VERY_AGGRESSIVE_100'
          }
          assert set(portfolio) == expected_profiles
          for profile_id, row in portfolio.items():
              assert row['maximum_single_slate_exposure_pct'] <= row['configured_exposure_cap_pct'] + 1e-12
              assert row['minimum_bankroll'] >= 0.0
          print('product_v2_hard_contracts=PASS')
          PY
          (
            cd artifacts/task05f/product_v2_a
            find . -type f -print0 | sort -z | xargs -0 sha256sum
          ) > artifacts/task05f/product_v2_evidence/output_sha256_manifest.txt

      - name: Upload product V2 validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task05f-product-v2-validation-${{ github.sha }}
          path: |
            artifacts/task05f/product_v2_a/
            artifacts/task05f/product_v2_evidence/
          if-no-files-found: error
