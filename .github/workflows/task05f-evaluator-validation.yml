name: Task05F Evaluator Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluator-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install evaluator test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[model-development]' pytest scipy pyyaml

      - name: Enforce evaluator-only scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=3ed8d740a88b59d46e27e206f39757307a6a13da
          git cat-file -e "$BASE^{commit}"
          git diff --name-only "$BASE"...HEAD | tee /tmp/task05f_changed_paths.txt
          if grep -E '^(src/nfl_edge/models/|src/nfl_edge/backtest/expected_margin|data/modeling/|data/frozen/|reports/task05d/|reports/task05e_remediated/|config/expected_margin|config/.*qb|config/.*xgb)' /tmp/task05f_changed_paths.txt; then
            echo 'ERROR: Task05F modified frozen football-model/data scope.' >&2
            exit 1
          fi

      - name: Record designated confidence-audit provenance
        shell: bash
        run: |
          mkdir -p artifacts/task05f/model_confidence_evidence
          printf '{\n  "commit": "%s",\n  "pre_audit_contract_sha": "%s",\n  "scope": "DESIGNATED_MODEL_CONFIDENCE_COVERAGE_AUDIT",\n  "results_label": "OBSERVATIONAL_ONLY_NOT_TUNED",\n  "sealed_season": 2025,\n  "may_tune_from_results": false\n}\n' \
            "$GITHUB_SHA" \
            '18f456307102a74608da1ae6e65150d93e117c72' \
            > artifacts/task05f/model_confidence_evidence/designated_run_provenance.json
          sha256sum config/task05f_model_confidence_audit_v1.yaml > artifacts/task05f/model_confidence_evidence/audit_config_sha256.txt
          sha256sum config/task05f_candidate_table_v1.yaml > artifacts/task05f/model_confidence_evidence/candidate_config_sha256.txt
          sha256sum config/task05f_selectors_v3_1_product_prereg.yaml > artifacts/task05f/model_confidence_evidence/selector_config_sha256.txt

      - name: Run Task05F value-layer tests
        run: pytest -q tests/value/

      - name: Compile confidence-audit stack
        run: |
          python -m py_compile scripts/task05f_candidate_table_v1_runner.py
          python -m py_compile src/nfl_edge/value/selectors_v3_1.py
          python -m py_compile scripts/task05f_model_confidence_audit_v1_runner.py

      - name: Verify preregistered audit contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'status: PREREGISTERED_BEFORE_MODEL_CONFIDENCE_AUDIT_EXECUTION' config/task05f_model_confidence_audit_v1.yaml
          grep -q 'results_label: OBSERVATIONAL_ONLY_NOT_TUNED' config/task05f_model_confidence_audit_v1.yaml
          grep -q 'expected_slates: 109' config/task05f_model_confidence_audit_v1.yaml
          grep -q 'freeze_all_model_native_and_current_selector_choices_before_outcome_join: true' config/task05f_model_confidence_audit_v1.yaml
          grep -q 'no_threshold_tuning: true' config/task05f_model_confidence_audit_v1.yaml
          grep -q 'no_2025: true' config/task05f_model_confidence_audit_v1.yaml

      - name: Run designated confidence audit twice for determinism
        run: |
          rm -rf artifacts/task05f/model_confidence_a artifacts/task05f/model_confidence_b
          python scripts/task05f_model_confidence_audit_v1_runner.py \
            --config config/task05f_model_confidence_audit_v1.yaml \
            --out artifacts/task05f/model_confidence_a
          python scripts/task05f_model_confidence_audit_v1_runner.py \
            --config config/task05f_model_confidence_audit_v1.yaml \
            --out artifacts/task05f/model_confidence_b

      - name: Verify deterministic audit and hard contracts
        shell: bash
        run: |
          set -euo pipefail
          diff -qr artifacts/task05f/model_confidence_a artifacts/task05f/model_confidence_b
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('artifacts/task05f/model_confidence_a')
          s = json.loads((root/'summary.json').read_text())
          p = json.loads((root/'provenance.json').read_text())
          assert s['label'] == 'OBSERVATIONAL_ONLY_NOT_TUNED'
          assert s['development_seasons'] == [2020, 2021, 2022, 2023, 2024]
          assert s['sealed_seasons'] == [2025]
          assert s['slates'] == 109
          assert s['candidate_rows'] == 8448
          assert p['selection_and_model_choices_frozen_before_outcome_join'] is True
          assert p['outcome_fields_in_candidate_table'] == []
          assert p['sealed_2025_loaded'] is False
          assert s['warnings']['expected_margin_60pct_is_straight_up_not_ats'] is True
          assert s['warnings']['historical_results_are_observational_only_not_tuned'] is True
          print('model_confidence_audit_hard_contracts=PASS')
          PY
          (
            cd artifacts/task05f/model_confidence_a
            find . -type f -print0 | sort -z | xargs -0 sha256sum
          ) > artifacts/task05f/model_confidence_evidence/output_sha256_manifest.txt

      - name: Upload confidence-audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task05f-model-confidence-audit-${{ github.sha }}
          path: |
            artifacts/task05f/model_confidence_a/
            artifacts/task05f/model_confidence_evidence/
          if-no-files-found: error
