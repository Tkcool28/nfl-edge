name: Task05F Evaluator Validation

on:
  push:
    branches:
      - feat/task05f-evaluator-rebuild-v1
  pull_request:
    branches:
      - main
    paths:
      - 'src/nfl_edge/value/**'
      - 'src/nfl_edge/user/**'
      - 'scripts/task05f_*'
      - 'tests/value/**'
      - 'config/task05f_*.yaml'
      - 'docs/task05f_*.md'
      - 'reports/task05f_*'
      - '.github/workflows/task05f-evaluator-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluator-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install evaluator test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[model-development]' pytest scipy pyyaml

      - name: Enforce evaluator-only scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=3ed8d740a88b59d46e27e206f39757307a6a13da
          git cat-file -e "$BASE^{commit}"
          git diff --name-only "$BASE"...HEAD | tee /tmp/task05f_changed_paths.txt
          if grep -E '^(src/nfl_edge/models/|src/nfl_edge/backtest/expected_margin|data/modeling/|data/frozen/|reports/task05d/|reports/task05e_remediated/|config/expected_margin|config/.*qb|config/.*xgb)' /tmp/task05f_changed_paths.txt; then
            echo 'ERROR: Task05F modified frozen football-model/data scope.' >&2
            exit 1
          fi

      - name: Record designated structural provenance
        shell: bash
        run: |
          mkdir -p artifacts/task05f/structural_evidence
          printf '{\n  "commit": "%s",\n  "scope": "DESIGNATED_V3_4_STRUCTURAL_REPLAY",\n  "historical_outcomes_scored": false,\n  "bankroll_simulated": false,\n  "sealed_season": 2025\n}\n' "$GITHUB_SHA" > artifacts/task05f/structural_evidence/designated_run_provenance.json
          sha256sum config/task05f_evaluated_wager_board_v1_prereg.yaml > artifacts/task05f/structural_evidence/evaluated_wager_board_sha256.txt
          sha256sum config/task05f_staking_v2_1_units_prereg.yaml > artifacts/task05f/structural_evidence/staking_v2_1_sha256.txt
          sha256sum config/task05f_selectors_v3_4_thin_prereg.yaml > artifacts/task05f/structural_evidence/selector_v3_4_sha256.txt
          sha256sum config/task05f_selector_v3_4_structural_replay_v1.yaml > artifacts/task05f/structural_evidence/structural_replay_sha256.txt

      - name: Run Task05F value-layer tests
        run: pytest -q tests/value/

      - name: Verify designated structural preregistration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'status: PREREGISTERED_BEFORE_STRUCTURAL_REPLAY_EXECUTION' config/task05f_selector_v3_4_structural_replay_v1.yaml
          grep -q 'open_historical_outcome_sidecar: true' config/task05f_selector_v3_4_structural_replay_v1.yaml
          grep -q 'score_wins_losses_pushes: true' config/task05f_selector_v3_4_structural_replay_v1.yaml
          grep -q 'calculate_roi: true' config/task05f_selector_v3_4_structural_replay_v1.yaml
          grep -q 'load_2025: true' config/task05f_selector_v3_4_structural_replay_v1.yaml
          python -m py_compile scripts/task05f_selectors_v3_4_structural_runner.py

      - name: Run designated structural replay twice for determinism
        run: |
          rm -rf artifacts/task05f/structural_a artifacts/task05f/structural_b
          python scripts/task05f_selectors_v3_4_structural_runner.py --out artifacts/task05f/structural_a
          python scripts/task05f_selectors_v3_4_structural_runner.py --out artifacts/task05f/structural_b

      - name: Verify deterministic no-outcome structural contracts
        shell: bash
        run: |
          set -euo pipefail
          diff -qr artifacts/task05f/structural_a artifacts/task05f/structural_b
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('artifacts/task05f/structural_a')
          s = json.loads((root/'structural_summary.json').read_text())
          p = json.loads((root/'provenance.json').read_text())
          assert s['candidate_rows'] == 8448
          assert s['evaluated_wager_rows'] == 8448
          assert s['slates'] == 109
          assert s['development_seasons'] == [2020, 2021, 2022, 2023, 2024]
          assert s['sealed_seasons'] == [2025]
          assert s['outcome_sidecar_opened'] is False
          assert s['historical_outcomes_scored'] is False
          assert s['bankroll_simulated'] is False
          assert p['outcome_sidecar_opened'] is False
          assert p['sealed_2025_loaded'] is False
          assert s['actionability']['actionable'] + s['actionability']['nonactionable'] == 8448
          for card in ('HIGH_HIT_RATE','BALANCED','VALUE'):
              assert s['cards'][card]['plays'] + s['cards'][card]['no_play'] == 109
          assert sum(int(v) for v in s['slates_by_featured_card_count'].values()) == 109
          print('v3_4_structural_hard_contracts=PASS')
          PY
          (
            cd artifacts/task05f/structural_a
            find . -type f -print0 | sort -z | xargs -0 sha256sum
          ) > artifacts/task05f/structural_evidence/output_sha256_manifest.txt

      - name: Upload designated structural evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task05f-v3-4-structural-${{ github.sha }}
          path: |
            artifacts/task05f/structural_a/
            artifacts/task05f/structural_evidence/
          if-no-files-found: error
