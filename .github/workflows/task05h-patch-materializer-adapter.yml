name: Task05H Wire Observation Adapter

on:
  push:
    branches:
      - feat/2025-complete-model-inputs-v1
    paths:
      - .github/workflows/task05h-patch-materializer-adapter.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire narrow 2025 observation adapter
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/task05h_2025_complete_model_inputs_v1.py')
          text = path.read_text()
          old = "from nfl_edge.features.totals_v1.game_observations import (\n    build_game_observations_with_provenance,\n)\n"
          new = "from nfl_edge.holdout.totals_observations_2025 import (\n    build_2025_game_observations_with_provenance,\n)\n"
          assert text.count(old) == 1
          text = text.replace(old, new)
          assert text.count('build_game_observations_with_provenance(') == 1
          text = text.replace('build_game_observations_with_provenance(', 'build_2025_game_observations_with_provenance(')
          assert 'build_game_observations_with_provenance' not in text
          path.write_text(text)
          PY
          git diff --check
          python -m py_compile src/nfl_edge/holdout/totals_observations_2025.py scripts/task05h_2025_complete_model_inputs_v1.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/task05h_2025_complete_model_inputs_v1.py
          git commit -m 'fix: route 2025 PBP through sealed holdout observation bridge'
          git push origin HEAD:feat/2025-complete-model-inputs-v1
