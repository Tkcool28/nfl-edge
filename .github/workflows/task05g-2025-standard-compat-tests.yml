name: Task05G 2025 Standard Compatibility Tests

on:
  pull_request:
    paths:
      - 'scripts/task05g_2025_standard_evaluation_v1.py'
      - 'src/nfl_edge/holdout/standard_product_compat_2025.py'
      - 'tests/holdout/test_standard_2025_history_adapter.py'
      - 'tests/holdout/test_standard_2025_product_compat.py'
      - '.github/workflows/task05g-2025-standard-compat-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OPENBLAS_CORETYPE: 'HASWELL'
      MKL_NUM_THREADS: '1'
      MKL_CBWR: 'COMPATIBLE'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install frozen development runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[model-development]' pyyaml pytest
      - name: Compile standard compatibility surfaces
        run: |
          python -m py_compile \
            scripts/task05g_2025_standard_evaluation_v1.py \
            src/nfl_edge/holdout/standard_product_compat_2025.py
      - name: Run standard compatibility regressions
        run: |
          pytest -q \
            tests/holdout/test_standard_2025_history_adapter.py \
            tests/holdout/test_standard_2025_product_compat.py
