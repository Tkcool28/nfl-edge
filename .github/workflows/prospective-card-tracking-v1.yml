name: Prospective Card Tracking V1

on:
  pull_request:
    paths:
      - 'src/nfl_edge/prospective/**'
      - 'src/nfl_edge/operations/production_refresh_v1.py'
      - 'tests/operations/test_production_refresh_v1.py'
      - 'deploy/systemd/nfl-edge-production-refresh.service'
      - 'docs/production_refresh_v1.md'
      - 'tests/prospective/**'
      - 'prospective/**'
      - 'schemas/NFL_EDGE_PROSPECTIVE_CARD_*'
      - '.github/workflows/prospective-card-tracking-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prospective-card-tracking-v1:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install production package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest 'jsonschema>=4.23,<5'

      - name: Prove frozen methodology and production generation surfaces are untouched
        run: |
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD)"
          echo "$changed"
          if echo "$changed" | grep -E '^(src/nfl_edge/models/|src/nfl_edge/backtest/|src/nfl_edge/value/|src/nfl_edge/recommendation/|src/nfl_edge/staking_policy_v1.py$|src/nfl_edge/live/|src/nfl_edge/backend/|config/)'; then
            echo 'ERROR: prospective evidence change touched a frozen/runtime production surface' >&2
            exit 1
          fi
          echo 'FROZEN_PRODUCTION_SURFACES_UNCHANGED=PASS'

      - name: Prove ordinary CI has zero Odds API credential
        run: |
          test -z "${ODDS_API_KEY:-}"
          echo 'ODDS_API_KEY_ABSENT_ZERO_CREDIT_CI=PASS'

      - name: Compile prospective implementation
        run: |
          python -m py_compile \
            src/nfl_edge/prospective/__init__.py \
            src/nfl_edge/prospective/common_v1.py \
            src/nfl_edge/prospective/capture_v1.py \
            src/nfl_edge/prospective/derive_v1.py \
            src/nfl_edge/prospective/results_v1.py \
            src/nfl_edge/prospective/runtime_v1.py \
            src/nfl_edge/prospective/card_tracking_v1.py \
            src/nfl_edge/operations/production_refresh_v1.py
          echo 'PROSPECTIVE_COMPILE=PASS'

      - name: Validate prospective schema documents
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from jsonschema.validators import validator_for

          paths = sorted(Path("schemas").glob("NFL_EDGE_PROSPECTIVE_CARD_*_V1.schema.json"))
          assert len(paths) == 5, paths
          for path in paths:
              schema = json.loads(path.read_text(encoding="utf-8"))
              validator_for(schema).check_schema(schema)
              print("SCHEMA_OK", path)
          PY

      - name: Run prospective and refresh-integration acceptance suite
        run: |
          pytest -q tests/prospective tests/operations/test_production_refresh_v1.py

      - name: Prove no historical production evidence was fabricated
        run: |
          if find prospective/cards -type f -name '*.json' -print -quit 2>/dev/null | grep -q .; then
            echo 'ERROR: branch contains card history before native runtime activation' >&2
            exit 1
          fi
          echo 'NO_FABRICATED_CARD_HISTORY=PASS'
