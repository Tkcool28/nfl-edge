name: Task05G Canonical Product Replay V1

on:
  pull_request:
    paths:
      - 'src/nfl_edge/recommendation/staking_v1.py'
      - 'src/nfl_edge/recommendation/headline_staking_v1.py'
      - 'scripts/task05g_canonical_product_replay_v1.py'
      - 'tests/recommendation/test_task05g_headline_staking_v1.py'
      - '.github/workflows/task05g-canonical-product-replay-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[model-development]' pyyaml pytest

      - name: Verify canonical integration and 2025 firewall
        run: |
          python -m py_compile \
            src/nfl_edge/recommendation/staking_v1.py \
            src/nfl_edge/recommendation/headline_staking_v1.py \
            scripts/task05g_canonical_product_replay_v1.py
          ! grep -n 'hhr_staking_audit\|headline_actionability_audit' scripts/task05g_canonical_product_replay_v1.py
          pytest -q \
            tests/recommendation/test_task05g_headline_staking_v1.py \
            tests/recommendation/test_task05g_staking_v1.py \
            tests/recommendation/test_task05g_product_policy_v1.py \
            tests/recommendation/test_task05g_final_selectors_v1.py

      - name: Reproduce frozen 2020-24 upstream board
        run: |
          python scripts/task05f_evaluator_final_runner.py --out artifacts/canonical/upstream
          python - <<'PY'
          import polars as pl
          board=pl.read_parquet('artifacts/canonical/upstream/historical_evaluator_board.parquet')
          seasons={int(x) for x in board['season'].unique().to_list()}
          assert seasons=={2020,2021,2022,2023,2024},seasons
          assert 2025 not in seasons
          PY
          python scripts/task05g_model_confidence_v2_entrypoint.py \
            --root . \
            --board artifacts/canonical/upstream/historical_evaluator_board.parquet \
            --out artifacts/canonical/v2
          python scripts/task05g_spread_confidence_v3_runner.py \
            --root . \
            --v2-candidates artifacts/canonical/v2/v2_candidate_table.parquet \
            --out artifacts/canonical/v3

      - name: Run canonical end-to-end replay twice
        run: |
          python scripts/task05g_canonical_product_replay_v1.py \
            --v3-candidates artifacts/canonical/v3/v3_candidate_table.parquet \
            --out artifacts/canonical/run_a
          python scripts/task05g_canonical_product_replay_v1.py \
            --v3-candidates artifacts/canonical/v3/v3_candidate_table.parquet \
            --out artifacts/canonical/run_b
          cmp artifacts/canonical/run_a/scorecard.json artifacts/canonical/run_b/scorecard.json
          cmp artifacts/canonical/run_a/headline_cards.csv artifacts/canonical/run_b/headline_cards.csv
          cmp artifacts/canonical/run_a/season_lane_summary.csv artifacts/canonical/run_b/season_lane_summary.csv
          cmp artifacts/canonical/run_a/all_cards_bankroll_scenarios.csv artifacts/canonical/run_b/all_cards_bankroll_scenarios.csv
          python - <<'PY'
          import json
          s=json.load(open('artifacts/canonical/run_a/scorecard.json'))
          assert s['sealed_not_run']==[2025]
          assert s['headline_counts']=={'balanced':88,'hit_rate':81,'value':68},s
          assert s['published_headline_counts']=={'balanced':88,'hit_rate':81,'value':68},s
          assert s['positive_current_bet_headline_counts']['hit_rate']==81,s
          assert s['positive_current_bet_headline_counts']['balanced']==88,s
          assert s['value_at_target_only_cards']==28,s
          assert s['value_suppressed_cards']==0,s
          assert all(s['invariants'].values()),s['invariants']
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: task05g-canonical-product-replay-${{ github.sha }}
          path: artifacts/canonical/run_a/
          if-no-files-found: error
