name: Task05G 2025 Historical Market Acquisition V1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task05g-2025-market-acquisition-v1
  cancel-in-progress: false

jobs:
  acquire:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      NFL_EDGE_2025_AUTHORIZATION: ${{ secrets.NFL_EDGE_2025_AUTHORIZATION }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install frozen runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[model-development]' pyyaml

      - name: Verify acquisition wrapper compiles
        run: |
          python -m py_compile \
            scripts/task05g_2025_market_plan_dry_run_v1.py \
            scripts/task05g_2025_market_acquire_v1.py \
            src/nfl_edge/holdout/market_2025.py \
            src/nfl_edge/market_data/runner.py

      - name: Execute exact frozen 2025 market acquisition
        run: |
          python scripts/task05g_2025_market_acquire_v1.py \
            | tee artifacts/task05g_2025_holdout_v1/market/acquisition_result_2025_v1.json

      - name: Upload acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task05g-2025-market-acquisition-${{ github.run_id }}
          path: |
            artifacts/task05g_2025_holdout_v1/market/
            data/market_data/holdout_2025/ledger/
            data/market_data/holdout_2025/raw/
          if-no-files-found: warn
