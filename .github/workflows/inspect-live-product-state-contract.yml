name: Inspect Live Product State Contract

on:
  push:
    branches:
      - feat/2026-live-market-product-snapshot-v1

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Print materializer prefix and confidence consumers
        run: |
          echo '=== PRODUCT_STATE_PREFIX ==='
          sed -n '1,299p' src/nfl_edge/live/product_state_2026.py
          echo '=== PRODUCT_CONFIDENCE_CONSUMERS ==='
          grep -n -B 18 -A 35 -E 'ml_confidence|spread_residuals|spread_v3' src/nfl_edge/live/product_2026.py
