name: Inspect Live Product State Contract

on:
  push:
    branches:
      - feat/2026-live-market-product-snapshot-v1

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      OPENBLAS_CORETYPE: "HASWELL"
      MKL_NUM_THREADS: "1"
      MKL_CBWR: "COMPATIBLE"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install accepted numerical runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[model-development]' pyyaml \
            'numpy==2.4.2' 'scipy==1.17.1' 'scikit-learn==1.8.0'
      - name: Materialize and fingerprint accepted Task05F starting state
        run: |
          set -euo pipefail
          rm -rf /tmp/task05f-start
          python scripts/task05f_evaluator_final_runner.py --out /tmp/task05f-start >/tmp/task05f-scorecard.txt
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          out=Path('/tmp/task05f-start')
          board=out/'historical_evaluator_board.parquet'
          state=out/'frozen_evaluator_state.json'
          board_sha=hashlib.sha256(board.read_bytes()).hexdigest()
          state_sha=hashlib.sha256(state.read_bytes()).hexdigest()
          payload=json.loads(state.read_text())
          print('TASK05F_HISTORICAL_BOARD_SHA256='+board_sha)
          print('TASK05F_FROZEN_STATE_SHA256='+state_sha)
          print('TASK05F_ML_INTERCEPT='+repr(payload['evaluators']['moneyline']['market_intercept']))
          assert board_sha == '58302290e4dc98d6db13e8e8a46c148e8c58533b2c9930370262982be06ce2a8'
          assert state_sha == '34ac985835ce4ceb65c6135b07851cd4f7e3ab2cc311315ae11efc773d1aa8c9'
          PY
      - name: Confirm 2025 standard workflow pins same board
        run: |
          grep -n '58302290e4dc98d6db13e8e8a46c148e8c58533b2c9930370262982be06ce2a8' \
            .github/workflows/task05g-2025-standard-evaluation-v1.yml
      - name: Stage bounded source capture
        run: |
          mkdir -p /tmp/live-state-source/src/nfl_edge/live /tmp/live-state-source/tests/live
          cp src/nfl_edge/live/product_state_2026.py /tmp/live-state-source/src/nfl_edge/live/
          cp tests/live/test_live_product_2026.py /tmp/live-state-source/tests/live/
      - uses: actions/upload-artifact@v4
        with:
          name: live-product-state-source-${{ github.sha }}
          path: /tmp/live-state-source/
          if-no-files-found: error
