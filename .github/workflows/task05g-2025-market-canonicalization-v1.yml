name: Task05G 2025 Market Canonicalization V1

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/acquisition_triggers/task05g_2025_market_canonicalization_v1.trigger

permissions:
  contents: read
  actions: read

concurrency:
  group: task05g-2025-market-canonicalization-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove outcome-blind thin-wrapper contract
        run: |
          python -m py_compile \
            scripts/task05g_2025_market_canonicalize_v1.py \
            src/nfl_edge/holdout/market_canonical_2025.py
          python - <<'PY'
          from pathlib import Path

          module = Path('src/nfl_edge/holdout/market_canonical_2025.py').read_text()
          required = [
              'EXPECTED_ACQUISITION_RUN_ID = 33254688086',
              'EXPECTED_ACQUISITION_ARTIFACT_ID = 9715458059',
              '081be41b05d246e50edf933b27b1ca75c63684d79520fdf73431c9c60009e7af',
              'd1b1eace49177bf01a22db9c2d9d991d07fe8144d165a9a8a67ba1f29f481425',
              'de36585a681bc79824b8427168ec4a74103fead35e2efc980590077d3eb20228',
              'EXPECTED_REQUEST_ROWS = 123',
              'EXPECTED_TARGET_GAMES = 285',
              'EXPECTED_CREDITS_SPENT = 3690',
              'build_normalized(',
              'build_canonical(',
              'score_or_outcome_columns_read',
          ]
          for fragment in required:
              assert fragment in module, fragment
          prohibited = [
              'ODDS_API_KEY_ENV',
              'run_plan(',
              'fetch_single(',
              'requests.get(',
              'httpx',
          ]
          for fragment in prohibited:
              assert fragment not in module, fragment
          print('CANONICALIZATION_THIN_WRAPPER=PASS')
          print('OUTCOME_COLUMNS_USED=0')
          print('ODDS_API_NETWORK_CALLS=0')
          PY

  canonicalize:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install frozen runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/lock.txt
          python -m pip install -e . --no-deps

      - name: Verify canonicalization code compiles
        run: |
          python -m py_compile \
            scripts/task05g_2025_market_canonicalize_v1.py \
            src/nfl_edge/holdout/market_canonical_2025.py \
            src/nfl_edge/market_data/normalize.py \
            src/nfl_edge/market_data/canonical.py

      - name: Download exact frozen acquisition artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/acquisition_source_v1
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9715458059/zip" \
            -o artifacts/acquisition_source_v1/source.zip
          echo "081be41b05d246e50edf933b27b1ca75c63684d79520fdf73431c9c60009e7af  artifacts/acquisition_source_v1/source.zip" \
            | sha256sum --check --strict
          unzip -q artifacts/acquisition_source_v1/source.zip \
            -d artifacts/acquisition_source_v1/extracted

      - name: Canonicalize outcome-blind 2025 market data
        shell: bash
        run: |
          set -o pipefail
          python scripts/task05g_2025_market_canonicalize_v1.py \
            --bundle-root artifacts/acquisition_source_v1/extracted \
            --output-root artifacts/task05g_2025_holdout_v1/market_canonicalization_v1 \
            2>&1 | tee artifacts/task05g_2025_holdout_v1/market_canonicalization_v1.log

      - name: Upload canonicalization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task05g-2025-market-canonicalization-${{ github.run_id }}
          path: |
            artifacts/task05g_2025_holdout_v1/market_canonicalization_v1/
            artifacts/task05g_2025_holdout_v1/market_canonicalization_v1.log
            artifacts/acquisition_source_v1/source.zip
          if-no-files-found: warn
          retention-days: 90
