name: Task05G Selector Policy Validation

on:
  push:
    branches:
      - feat/task05g-selectors-units-v1
      - feat/task05g-remediation-preregistered-v1
  pull_request:
    branches:
      - main
      - feat/task05g-selectors-units-v1
    paths:
      - 'src/nfl_edge/recommendation/**'
      - 'scripts/task05g_*'
      - 'tests/recommendation/**'
      - 'config/task05g_selector_unit_policy_v1.yaml'
      - 'config/task05g_remediation_preregistered_v1.yaml'
      - 'docs/task05g_selector_unit_policy_v1.md'
      - 'docs/task05g_remediation_preregistration_v1.md'
      - '.github/workflows/task05g-selector-policy-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  task05g-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[model-development]' pytest pyyaml

      - name: Enforce Task05G scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=4984ea1ee38377f7f5016d2081be8f7c43bda4cd
          git cat-file -e "$BASE^{commit}"
          git diff --name-only "$BASE"...HEAD | tee /tmp/task05g_paths.txt
          if grep -E '^(src/nfl_edge/value/|src/nfl_edge/models/|src/nfl_edge/backtest/|data/modeling/|data/frozen/|reports/task05d/|reports/task05e_remediated/)' /tmp/task05g_paths.txt; then
            echo 'ERROR: Task05G modified frozen evaluator/model/data scope.' >&2
            exit 1
          fi
          git diff --quiet "$BASE"...HEAD -- src/nfl_edge/value src/nfl_edge/models src/nfl_edge/backtest data/modeling data/frozen reports/task05d reports/task05e_remediated

      - name: Prove remediation preregistration is frozen before implementation
        if: ${{ contains(github.ref, 'task05g-remediation') || contains(github.head_ref, 'task05g-remediation') }}
        shell: bash
        run: |
          set -euo pipefail
          PREREG=4b860cd1c87d605d26b305a7d7c90c8a1f34f315
          git cat-file -e "$PREREG^{commit}"
          git merge-base --is-ancestor "$PREREG" HEAD
          first=$(git log --reverse --format='%H' -- config/task05g_remediation_preregistered_v1.yaml | head -1)
          test "$first" = "$PREREG"
          git diff --quiet "$PREREG"..HEAD -- config/task05g_remediation_preregistered_v1.yaml

      - name: Compile Task05G
        run: |
          python -m py_compile src/nfl_edge/recommendation/*.py
          python -m py_compile scripts/task05g_selector_policy_runner.py
          python -m py_compile scripts/task05g_selector_sensitivity.py
          python -m py_compile scripts/task05g_forensic_audit.py
          python -m py_compile scripts/task05g_model_evaluator_trace.py
          python -m py_compile scripts/task05g_market_side_mapping_audit.py
          if test -f scripts/task05g_remediation_runner.py; then python -m py_compile scripts/task05g_remediation_runner.py; fi

      - name: Run frozen Task05F and focused Task05G tests
        run: |
          if test -f tests/recommendation/test_task05g_remediation_v1.py; then
            pytest -q tests/value/test_task05f_*.py tests/recommendation/test_task05g_policy.py tests/recommendation/test_task05g_remediation_v1.py
          else
            pytest -q tests/value/test_task05f_*.py tests/recommendation/test_task05g_policy.py
          fi

      - name: Materialize frozen Task05F chronological board
        run: |
          python scripts/task05f_evaluator_final_runner.py --out artifacts/task05g/upstream

      - name: Verify 2025 firewall before selector evaluation
        run: |
          python - <<'PY'
          import polars as pl
          for name in ['historical_evaluator_board.parquet','candidate_table.parquet']:
              df=pl.read_parquet('artifacts/task05g/upstream/'+name)
              assert set(df['season'].unique().to_list()) == {2020,2021,2022,2023,2024}, (name, df['season'].unique().to_list())
              assert 2025 not in set(df['season'].unique().to_list())
          PY

      - name: Run Task05G chronological policy twice
        run: |
          python scripts/task05g_selector_policy_runner.py --task05f-dir artifacts/task05g/upstream --out artifacts/task05g/policy_a
          python scripts/task05g_selector_policy_runner.py --task05f-dir artifacts/task05g/upstream --out artifacts/task05g/policy_b

      - name: Run preregistered sensitivity twice
        run: |
          python scripts/task05g_selector_sensitivity.py --board artifacts/task05g/upstream/historical_evaluator_board.parquet --selector-results artifacts/task05g/policy_a/chronological_selector_results.csv --out artifacts/task05g/policy_a/preregistered_value_sensitivity.json
          python scripts/task05g_selector_sensitivity.py --board artifacts/task05g/upstream/historical_evaluator_board.parquet --selector-results artifacts/task05g/policy_b/chronological_selector_results.csv --out artifacts/task05g/policy_b/preregistered_value_sensitivity.json

      - name: Run forensic selector audit twice
        run: |
          python scripts/task05g_forensic_audit.py --board artifacts/task05g/upstream/historical_evaluator_board.parquet --selector-results artifacts/task05g/policy_a/chronological_selector_results.csv --games data/frozen/games/games_2018_2025.parquet --out artifacts/task05g/policy_a/forensic_audit.json
          python scripts/task05g_forensic_audit.py --board artifacts/task05g/upstream/historical_evaluator_board.parquet --selector-results artifacts/task05g/policy_b/chronological_selector_results.csv --games data/frozen/games/games_2018_2025.parquet --out artifacts/task05g/policy_b/forensic_audit.json

      - name: Trace model signal through evaluator twice
        run: |
          python scripts/task05g_model_evaluator_trace.py --root . --board artifacts/task05g/upstream/historical_evaluator_board.parquet --selector-results artifacts/task05g/policy_a/chronological_selector_results.csv --state-by-block artifacts/task05g/upstream/state_by_block.ndjson --out artifacts/task05g/policy_a/model_evaluator_trace.json
          python scripts/task05g_model_evaluator_trace.py --root . --board artifacts/task05g/upstream/historical_evaluator_board.parquet --selector-results artifacts/task05g/policy_b/chronological_selector_results.csv --state-by-block artifacts/task05g/upstream/state_by_block.ndjson --out artifacts/task05g/policy_b/model_evaluator_trace.json

      - name: Audit exact ML team-side mapping twice
        run: |
          python scripts/task05g_market_side_mapping_audit.py --root . --selector-results artifacts/task05g/policy_a/chronological_selector_results.csv --out artifacts/task05g/policy_a/market_side_mapping_audit.json
          python scripts/task05g_market_side_mapping_audit.py --root . --selector-results artifacts/task05g/policy_b/chronological_selector_results.csv --out artifacts/task05g/policy_b/market_side_mapping_audit.json

      - name: Prove deterministic Task05G replay
        shell: bash
        run: |
          set -euo pipefail
          for name in chronological_selector_results.csv selector_diagnostics.json coverage_report.json season_stability_report.json unit_risk_profile_simulation.json longshot_behavior.json artifact_hashes.json preregistered_value_sensitivity.json forensic_audit.json model_evaluator_trace.json market_side_mapping_audit.json; do
            cmp "artifacts/task05g/policy_a/$name" "artifacts/task05g/policy_b/$name"
          done

      - name: Run preregistered remediation twice
        if: ${{ contains(github.ref, 'task05g-remediation') || contains(github.head_ref, 'task05g-remediation') }}
        run: |
          python scripts/task05g_remediation_runner.py --task05f-dir artifacts/task05g/upstream --out artifacts/task05g/remediation_a
          python scripts/task05g_remediation_runner.py --task05f-dir artifacts/task05g/upstream --out artifacts/task05g/remediation_b

      - name: Prove deterministic remediation replay
        if: ${{ contains(github.ref, 'task05g-remediation') || contains(github.head_ref, 'task05g-remediation') }}
        shell: bash
        run: |
          set -euo pipefail
          for name in chronological_remediation_results.csv chronological_original_policy_results.csv remediation_diagnostics.json task05e_candidate_baseline.json unit_risk_profile_simulation.json guardrail_report.json artifact_hashes.json; do
            cmp "artifacts/task05g/remediation_a/$name" "artifacts/task05g/remediation_b/$name"
          done

      - name: Validate policy invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/task05g/policy_a')
          d=json.loads((p/'selector_diagnostics.json').read_text())
          l=json.loads((p/'longshot_behavior.json').read_text())
          r=json.loads((p/'unit_risk_profile_simulation.json').read_text())
          s=json.loads((p/'preregistered_value_sensitivity.json').read_text())
          f=json.loads((p/'forensic_audit.json').read_text())
          t=json.loads((p/'model_evaluator_trace.json').read_text())
          m=json.loads((p/'market_side_mapping_audit.json').read_text())
          assert d['development_seasons'] == [2020,2021,2022,2023,2024]
          assert d['sealed_seasons'] == [2025]
          assert l['selected_value_longshot_guardrail_violations'] == 0
          assert len(r['profiles']) == 5
          assert r['selector_identity_shared_across_profiles'] is True
          assert r['recommended_units_shared_across_profiles'] is True
          assert s['family_selection_performed'] is False
          assert set(s['value_threshold_families']) == {'conservative','frozen_primary','permissive'}
          assert f['development_seasons'] == [2020,2021,2022,2023,2024]
          assert t['development_seasons'] == [2020,2021,2022,2023,2024]
          assert m['development_seasons'] == [2020,2021,2022,2023,2024]
          assert m['canonical_game_id_home_away_mismatches'] == 0
          assert m['no_expected_team_price_match'] == 0
          PY

      - name: Validate remediation invariants and original-policy parity
        if: ${{ contains(github.ref, 'task05g-remediation') || contains(github.head_ref, 'task05g-remediation') }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/task05g/remediation_a')
          d=json.loads((p/'remediation_diagnostics.json').read_text())
          g=json.loads((p/'guardrail_report.json').read_text())
          r=json.loads((p/'unit_risk_profile_simulation.json').read_text())
          assert d['development_seasons'] == [2020,2021,2022,2023,2024]
          assert d['sealed_seasons'] == [2025]
          assert d['registry_candidate_sides'] > 0
          assert g['selected_value_longshot_guardrail_violations'] == 0
          assert g['totals_headline_selections'] == 0
          assert g['non_model_candidate_headline_selections'] == 0
          assert len(r['profiles']) == 5
          old=d['original_task05g_v1_same_board']
          assert old['hit_rate']['overall']['plays'] == 59
          assert old['balanced']['overall']['plays'] == 67
          assert old['value']['overall']['plays'] == 61
          PY

      - name: Security checks
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE 'os\.environ|os\.getenv|API_KEY|ACCESS_TOKEN|SECRET_KEY' src/nfl_edge/recommendation scripts/task05g_selector_policy_runner.py scripts/task05g_selector_sensitivity.py scripts/task05g_forensic_audit.py scripts/task05g_model_evaluator_trace.py scripts/task05g_market_side_mapping_audit.py config/task05g_selector_unit_policy_v1.yaml; then
            echo 'ERROR: Task05G policy scope must not serialize or depend on environment secrets.' >&2
            exit 1
          fi
          if test -f scripts/task05g_remediation_runner.py; then
            if grep -nE 'os\.environ|os\.getenv|API_KEY|ACCESS_TOKEN|SECRET_KEY' scripts/task05g_remediation_runner.py config/task05g_remediation_preregistered_v1.yaml; then
              echo 'ERROR: remediation must not depend on environment secrets.' >&2
              exit 1
            fi
          fi
          if grep -E '(^|/)(\.env|.*\.pem|.*\.key|credentials.*|secrets.*)$' /tmp/task05g_paths.txt; then
            echo 'ERROR: secret-bearing file path in Task05G diff.' >&2
            exit 1
          fi

      - name: Record scope and frozen proofs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/task05g/policy_a/proofs
          cp /tmp/task05g_paths.txt artifacts/task05g/policy_a/proofs/changed_paths.txt
          printf '%s\n' '4984ea1ee38377f7f5016d2081be8f7c43bda4cd' > artifacts/task05g/policy_a/proofs/base_main_sha.txt
          git diff --name-only 4984ea1ee38377f7f5016d2081be8f7c43bda4cd...HEAD -- src/nfl_edge/value src/nfl_edge/models src/nfl_edge/backtest data/modeling data/frozen reports/task05d reports/task05e_remediated > artifacts/task05g/policy_a/proofs/frozen_scope_diff.txt
          test ! -s artifacts/task05g/policy_a/proofs/frozen_scope_diff.txt

      - name: Upload Task05G evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task05g-selector-policy-${{ github.sha }}
          path: |
            artifacts/task05g/policy_a/
            artifacts/task05g/remediation_a/
            artifacts/task05g/upstream/historical_evaluator_board.parquet
            artifacts/task05g/upstream/candidate_table.parquet
            artifacts/task05g/upstream/scorecard.json
            artifacts/task05g/upstream/state_by_block.ndjson
          if-no-files-found: error
