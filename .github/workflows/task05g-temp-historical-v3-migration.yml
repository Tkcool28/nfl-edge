name: Task05G One-Shot Historical V3 Migration

on:
  pull_request:
    paths:
      - '.github/workflows/task05g-temp-historical-v3-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/task05g-headline-staking-integration-v1
          fetch-depth: 0
      - name: Replace historical baseline references only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/task05g_spread_confidence_v3_runner.py')
          text=p.read_text()
          replacements={
              'core._v1_selections(v3, DEV, core.select_hit_rate)': 'core._v1_selections(v3, DEV, core._legacy_v1_select_hit_rate)',
              'core._v1_selections(v3, DEV, core.select_balanced)': 'core._v1_selections(v3, DEV, core._legacy_v1_select_balanced)',
          }
          for old,new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected historical reference: {old}')
              text=text.replace(old,new)
          p.write_text(text)
          PY
          git diff --check
          git diff -- scripts/task05g_spread_confidence_v3_runner.py
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/task05g_spread_confidence_v3_runner.py
          git commit -m 'Task05G: isolate Spread V3 historical V1 baseline'
          git push origin HEAD:feat/task05g-headline-staking-integration-v1
